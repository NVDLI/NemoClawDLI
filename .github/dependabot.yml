version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["kind:validation", "area:security", "state:needs-triage"]
    groups:
      reviewed-actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/scripts/materials"
    schedule:
      interval: weekly
    labels: ["kind:validation", "area:security", "state:needs-triage"]
    groups:
      material-tools:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/scripts/security"
    schedule:
      interval: weekly
    labels: ["kind:validation", "area:security", "state:needs-triage"]
    groups:
      security-tools:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/scripts/runtime"
    schedule:
      interval: weekly
    labels: ["kind:validation", "area:security", "state:needs-triage"]
    groups:
      host-browser-api:
        patterns: ["*"]
