# This workflow is intentionally pull_request_target: GitHub loads it from the trusted base
# branch. Candidate Git objects are read as bytes by the base-owned scanner and never checked out.
name: Contribution boundary

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  scan-proposed-tree:
    name: Trusted full-tree sensitive-content boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out only the trusted base scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch the proposed tree as inert Git objects
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GIT_TERMINAL_PROMPT: "0"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=$CANDIDATE_READ_TOKEN"; }; f'
          CANDIDATE_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          git fetch --no-tags --depth=1 origin "refs/pull/${PR_NUMBER}/head"
      - name: Scan the proposed tree as inert Git objects
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE_SHA"
          python3 scripts/validation/sensitive_content_audit.py --git-tree "$CANDIDATE_SHA"
