# Validate an existing protected tag, build a reproducible public artifact, then
# create a draft GitHub release behind the github-release environment approval.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing protected tag to package (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify external publication approval
        run: python3 scripts/validation/contribution_safety_audit.py --require-publication-approved
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Verify protected release input
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 -c 'import re,sys; tag=sys.argv[1]; ok=re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:[-+][0-9A-Za-z.-]+)?", tag); sys.exit(0 if ok else 1)' "$RELEASE_TAG" || { echo "refusing release: tag must match semantic vMAJOR.MINOR.PATCH" >&2; exit 1; }
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || { echo "refusing release: tag does not exist" >&2; exit 1; }
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag" || { echo "refusing release: release tag must be annotated" >&2; exit 1; }
          git fetch origin main --quiet
          git merge-base --is-ancestor "$RELEASE_TAG^{commit}" origin/main || { echo "refusing release: tag is not contained in origin/main" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")" || { echo "refusing release: checkout SHA differs from tag" >&2; exit 1; }
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$RELEASE_TAG^{commit}")" >> "$GITHUB_ENV"
      - name: Install public validation dependencies
        run: python3 -m pip install --retries 5 --timeout 30 --requirement scripts/materials/requirements.lock
      - name: Required live material provenance check
        run: python3 scripts/materials/pull_materials.py --check --fetch-attempts 4 --retry-backoff 2 --host-delay 3
      - name: Required release gate
        run: python3 scripts/validation/release_gate.py --tier ship --timing-report docs/validation/release-gate-timings.json
      - name: Resolve release environment and emit SBOM
        run: |
          set -euo pipefail
          python3 -m venv .release-runtime-venv
          python3 -m venv .release-scan-venv
          .release-runtime-venv/bin/python -m pip install -q -r workspace/requirements.lock
          .release-scan-venv/bin/python -m pip install -q -r scripts/security/requirements-sca.lock
          RUNTIME_SITE="$(.release-runtime-venv/bin/python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          PATH="$PWD/.release-scan-venv/bin:$PATH" .release-scan-venv/bin/python \
            scripts/security/run_full_sca.py --execute --require-tools --python-local \
            --cyclonedx-env --python-executable "$PWD/.release-runtime-venv/bin/python" \
            --python-path "$RUNTIME_SITE" --out-dir release-security
          .release-scan-venv/bin/python scripts/security/audit_sbom_policy.py \
            --sbom release-security/python-env.cdx.json \
            --report release-security/sbom-policy.json
      - name: Build reproducible release archive
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          export BUILD_PAGES_LANGS=0
          export BUILD_PAGES_PULL_MATERIALS=0
          BUILD_PAGES_REUSE_VALIDATION=1 bash scripts/build/build_pages.sh public
          mkdir -p release-assets release-evidence
          cp release-security/python-env.cdx.json "release-security/nemoclaw-$RELEASE_TAG.python-env.cdx.json"
          cp web/nemoclaw/vendor/browser-sbom.cdx.json "release-security/nemoclaw-$RELEASE_TAG.browser.cdx.json"
          cp docs/validation/latest.json release-evidence/validation.json
          cp docs/validation/latest.md release-evidence/validation.md
          cp docs/validation/contribution-safety.json release-evidence/contribution-safety.json
          cp release-security/pip-audit-local.json release-evidence/pip-audit-local.json
          cp release-security/sbom-policy.json release-evidence/sbom-policy.json
          python3 scripts/build/package_release.py \
            --site-root public \
            --out-dir release-assets \
            --tag "$RELEASE_TAG" \
            --commit "$(git rev-parse "$RELEASE_TAG^{commit}")" \
            --tag-object "$(git rev-parse "refs/tags/$RELEASE_TAG")" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --asset "release-security/nemoclaw-$RELEASE_TAG.python-env.cdx.json" \
            --asset "release-security/nemoclaw-$RELEASE_TAG.browser.cdx.json"
          test -f release-assets/release-manifest.json
          test -f release-assets/SHA256SUMS
          (cd release-assets && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ inputs.tag }}
          path: |
            release-assets/
            release-evidence/
          if-no-files-found: error
          retention-days: 30

  draft-release:
    needs: validate-and-package
    runs-on: ubuntu-latest
    environment:
      name: github-release
    permissions:
      contents: write
    concurrency:
      group: github-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ inputs.tag }}
      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true" || { echo "refusing release: existing release is already published" >&2; exit 1; }
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --draft --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
          echo "Draft prepared. Human release manager must review notes, evidence, manifest, SBOM, and checksums before immutable publication."
