<svg class="gfx-dark" viewBox="0 0 940 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lilian Weng's 2023 map of an LLM agent. A language model sits at the center as the agent. Memory is above it (branching into short-term and long-term memory), Action is below, Tools are on the left (Calendar, Calculator, CodeInterpreter, Search, and more), and Planning is on the right (reflection, self-critique, chain of thought, subgoal decomposition). The model is the core controller; memory, planning, tools, and action are components wired around it." preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:8px;padding:14px;max-width:1040px;margin:1.5rem auto">
