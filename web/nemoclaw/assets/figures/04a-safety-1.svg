<svg class="gfx-dark" viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;display:block;background:var(--bg,#0d0d0d);border:1px solid var(--e3,#2a2a2a);border-radius:8px;padding:14px;max-width:1040px;margin:1.5rem auto"
     role="img" aria-label="Three concentric defense rings around an agent core, with side labels connected by leader lines. From inside to outside the rings are prompt rules, application guardrails, and kernel containment. An outbound action arrow leaves the agent and is stopped at the outermost ring. An outside-world box sits beyond the rings on the right.">
  <defs>
    <marker id="ring-q6-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="var(--gfx-red,#d74e4e)"/></marker>
  </defs>

  <circle cx="200" cy="158" r="120" fill="var(--gfx-tint-blue,#0d1828)" stroke="var(--gfx-blue,#3b82f6)" stroke-width="1.5"/>
  <circle cx="200" cy="158" r="88"  fill="var(--gfx-tint-sub,#eef1f4)" stroke="var(--gfx-blue,#3b82f6)" stroke-width="1.5"/>
  <circle cx="200" cy="158" r="56"  fill="var(--gfx-panel,#f6f8fa)" stroke="var(--gfx-blue,#3b82f6)" stroke-width="1.5"/>
  <circle cx="200" cy="158" r="28"  fill="var(--e1,#fef9ee)" stroke="var(--gfx-amber,#cc7a00)" stroke-width="2.5"/>

  <text x="200" y="155" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace" fill="var(--tx,#1a1a1a)" font-weight="800">agent</text>
  <text x="200" y="168" text-anchor="middle" font-size="9" font-family="ui-monospace, monospace" fill="var(--tx,#1a1a1a)">process</text>

  <line x1="290" y1="88" x2="380" y2="68"  stroke="var(--gfx-sub,#a5a5a5)" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="265" y1="108" x2="380" y2="136" stroke="var(--gfx-sub,#a5a5a5)" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="235" y1="126" x2="380" y2="204" stroke="var(--gfx-sub,#a5a5a5)" stroke-width="1" stroke-dasharray="2 2"/>

  <rect x="380" y="48"  width="220" height="40" rx="6" fill="var(--gfx-tint-blue,#0d1828)" stroke="var(--gfx-blue,#3b82f6)" stroke-width="1.5"/>
  <text x="490" y="66"  text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="var(--gfx-blue,#c8d8f0)" font-weight="700">kernel containment</text>
  <text x="490" y="80"  text-anchor="middle" font-size="9"  font-family="ui-monospace, monospace" fill="var(--gfx-sub,#6888aa)">Landlock · seccomp · netns</text>

  <rect x="380" y="116" width="220" height="40" rx="6" fill="var(--gfx-tint-sub,#eef1f4)" stroke="var(--gfx-blue,#3b82f6)" stroke-width="1.5"/>
  <text x="490" y="134" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="var(--gfx-blue,#c8d8f0)" font-weight="700">application guardrails</text>
  <text x="490" y="148" text-anchor="middle" font-size="9"  font-family="ui-monospace, monospace" fill="var(--gfx-sub,#6888aa)">model-based · rule-based filters</text>

  <rect x="380" y="184" width="220" height="40" rx="6" fill="var(--gfx-panel,#f6f8fa)" stroke="var(--gfx-blue,#3b82f6)" stroke-width="1.5"/>
  <text x="490" y="202" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="var(--gfx-blue,#c8d8f0)" font-weight="700">prompt rules</text>
  <text x="490" y="216" text-anchor="middle" font-size="9"  font-family="ui-monospace, monospace" fill="var(--gfx-sub,#6888aa)">in-context instructions</text>

  <line x1="228" y1="158" x2="317" y2="158" stroke="var(--gfx-red,#d74e4e)" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#ring-q6-fail)"/>

  <rect x="380" y="254" width="220" height="32" rx="6" fill="var(--gfx-panel,#f6f8fa)" stroke="var(--gfx-line,#d0d7de)"/>
  <text x="490" y="275" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="var(--gfx-ink,#1a1a1a)">outside world  ·  disk · network</text>
</svg>
