<svg class="gfx-dark" viewBox="0 38 820 234" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One turn of the ReAct loop as it runs in code. The model produces a Thought and either stops or requests a tool. On a tool request, the Action box runs your function and the Observation box appends the result to the messages array, then the loop returns to Thought. When finish_reason is stop, the turn exits to the final answer instead." style="width:100%;max-width:1040px;height:auto;display:block;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:8px;padding:14px;margin:1em auto">
      <defs>
        <marker id="rx-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="var(--gfx-sub,#9aa0a6)"></path></marker>
        <marker id="rx-arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="var(--gfx-green,#9bd14a)"></path></marker>
      </defs>
      <rect x="70" y="46" width="170" height="32" rx="16" fill="var(--gfx-tint-green,#1d2a12)" stroke="var(--gfx-green,#9bd14a)" stroke-width="1.6"></rect>
      <text x="155" y="67" text-anchor="middle" font-size="13" font-family="ui-monospace, monospace" fill="var(--gfx-green,#9bd14a)" font-weight="700">✓ final answer</text>
      <path d="M 150 104 L 150 80" stroke="var(--gfx-sub,#9aa0a6)" stroke-width="1.8" fill="none" marker-end="url(#rx-arr)"></path>
      <text x="170" y="97" text-anchor="start" font-size="11.5" font-family="ui-monospace, monospace" fill="var(--gfx-faint,#6b7177)">finish_reason "stop"</text>
      <rect x="60" y="106" width="185" height="100" rx="11" fill="var(--gfx-tint-blue,#15273d)" stroke="var(--gfx-blue,#5aa8ff)" stroke-width="2"></rect>
      <text x="150" y="150" text-anchor="middle" font-size="18" font-family="ui-monospace, monospace" fill="var(--gfx-blue,#5aa8ff)" font-weight="700">Thought</text>
      <text x="150" y="174" text-anchor="middle" font-size="13" font-family="ui-monospace, monospace" fill="var(--gfx-sub,#9aa0a6)">the model decides</text>
      <rect x="290" y="106" width="240" height="100" rx="11" fill="var(--gfx-tint-green,#1d2a12)" stroke="var(--gfx-green,#9bd14a)" stroke-width="2"></rect>
      <text x="410" y="150" text-anchor="middle" font-size="18" font-family="ui-monospace, monospace" fill="var(--gfx-green,#9bd14a)" font-weight="700">Action</text>
      <text x="410" y="174" text-anchor="middle" font-size="13" font-family="ui-monospace, monospace" fill="var(--gfx-sub,#9aa0a6)">your code runs the tool</text>
      <rect x="575" y="106" width="190" height="100" rx="11" fill="var(--gfx-tint-amber,#33280f)" stroke="var(--gfx-amber,#e3b341)" stroke-width="2"></rect>
      <text x="670" y="150" text-anchor="middle" font-size="18" font-family="ui-monospace, monospace" fill="var(--gfx-amber,#e3b341)" font-weight="700">Observation</text>
      <text x="670" y="174" text-anchor="middle" font-size="13" font-family="ui-monospace, monospace" fill="var(--gfx-sub,#9aa0a6)">result → messages[]</text>
      <path d="M 250 156 L 285 156" stroke="var(--gfx-sub,#9aa0a6)" stroke-width="1.8" fill="none" marker-end="url(#rx-arr)"></path>
      <text x="280" y="147" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="var(--gfx-faint,#6b7177)">tool_calls</text>
      <path d="M 535 156 L 570 156" stroke="var(--gfx-sub,#9aa0a6)" stroke-width="1.8" fill="none" marker-end="url(#rx-arr)"></path>
      <text x="540" y="147" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="var(--gfx-faint,#6b7177)">return</text>
      <path d="M 670 206 L 670 262 L 150 262 L 150 206" stroke="var(--gfx-green,#9bd14a)" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#rx-arr-g)"></path>
      <text x="410" y="256" text-anchor="middle" font-size="12.5" font-family="ui-monospace, monospace" fill="var(--gfx-green,#9bd14a)">append the result, call the model again</text>
    </svg>
