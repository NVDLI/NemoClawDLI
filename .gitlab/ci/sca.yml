# Self-contained SCA jobs. They deliberately inherit neither root defaults nor root variables.
# Change-sensitive rules name this file, so scanner-policy edits run both focused scans.
.sca_base: &sca_base
  inherit:
    default: false
    variables: false
  image: node:20-bookworm-slim@sha256:25070a03f077f5860e4f2db8d147380678ed40ead415a21eaffd5a6208f61948
  tags: [pages]
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .cache/pip
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - scheduler_failure
  before_script:
    - |
      set -euo pipefail
      retry_cmd() {
        attempt=1
        until "$@"; do
          if [ "$attempt" -ge 3 ]; then return 1; fi
          delay=$((attempt * 3))
          echo "retrying transient SCA setup in ${delay}s (attempt $((attempt + 1))/3)" >&2
          sleep "$delay"
          attempt=$((attempt + 1))
        done
      }
      retry_cmd apt-get update -qq
      retry_cmd apt-get install -y -qq --no-install-recommends python3 python3-pip python3-venv ca-certificates curl git >/dev/null

security_browser_sca:
  <<: *sca_base
  stage: test
  script:
    - mkdir -p scripts/security/reports
    - npm ci --prefix scripts/browser-vendor --ignore-scripts
    - python3 scripts/compliance/source_license_contract.py --verify-browser-upstream
    - node scripts/build/vendor_browser_dependencies.mjs
    - git diff --exit-code -- web/nemoclaw/vendor
    # npm retries transport failures internally; advisory findings still fail immediately.
    - npm audit --prefix scripts/browser-vendor --package-lock-only --audit-level=moderate --json --fetch-retries=3 --fetch-retry-mintimeout=2000 --fetch-retry-maxtimeout=10000 --fetch-timeout=30000 > scripts/security/reports/browser-npm-audit.json
    - corepack enable
    - '(cd scripts/runtime && pnpm install --frozen-lockfile --ignore-scripts)'
    # pnpm 10 still installs the reviewed Node 20 lock, but its audit client calls
    # registry endpoints retired in 2026. Project the exact single-package runtime
    # declaration into an npm lock so npm can query the supported bulk endpoint.
    - rm -rf .cache/runtime-npm-audit
    - mkdir -p .cache/runtime-npm-audit
    - cp scripts/runtime/package.json .cache/runtime-npm-audit/package.json
    - npm install --prefix .cache/runtime-npm-audit --package-lock-only --ignore-scripts --no-audit --fund=false
    - npm audit --prefix .cache/runtime-npm-audit --package-lock-only --audit-level=moderate --json > scripts/security/reports/runtime-npm-audit.json
    - python3 scripts/validation/course_dependency_integrity.py
  artifacts:
    when: always
    name: "security-browser-sca-$CI_COMMIT_SHORT_SHA"
    paths:
      - scripts/security/reports/browser-npm-audit.json
      - scripts/security/reports/runtime-npm-audit.json
    expire_in: 30 days
  rules:
    - if: '$COURSE_PRIVILEGED_PIPELINE == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - scripts/browser-vendor/package.json
        - scripts/browser-vendor/package-lock.json
        - scripts/runtime/package.json
        - scripts/runtime/pnpm-lock.yaml
        - scripts/runtime/browser-runtime.json
        - scripts/browser-vendor/**/*
        - scripts/build/vendor_browser_dependencies.mjs
        - scripts/compliance/source_license_contract.py
        - scripts/compliance/docs/browser_vendor_exceptions.json
        - scripts/validation/course_dependency_integrity.py
        - tests/validation/test_source_license_contract.py
        - THIRD-PARTY-NOTICES.md
        - web/nemoclaw/vendor/browser-dependencies.json
        - web/nemoclaw/vendor/browser-sbom.cdx.json
        - web/nemoclaw/vendor/**/*
        - .gitlab/ci/sca.yml
      when: on_success
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
    - when: never

security_sca:
  <<: *sca_base
  stage: test
  script:
    - mkdir -p scripts/security/reports
    - python3 -m venv .sca-tools-venv
    - '.sca-tools-venv/bin/python -m pip install --require-hashes --no-deps --only-binary=:all: -q -r scripts/security/requirements-sca.lock'
    - PATH="$CI_PROJECT_DIR/.sca-tools-venv/bin:$PATH" .sca-tools-venv/bin/python scripts/security/run_full_sca.py --execute --python-local --cyclonedx-env --out-dir scripts/security/reports
  artifacts:
    when: always
    name: "security-sca-$CI_COMMIT_SHORT_SHA"
    paths:
      - scripts/security/reports/
    expire_in: 30 days
  rules:
    - if: '$COURSE_PRIVILEGED_PIPELINE == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - .gitlab-ci.yml
        - .gitlab/ci/core.yml
        - .gitlab/ci/sca.yml
        - .gitlab/ci/privileged.yml
        - .gitlab/ci/privileged-child.yml
        - .gitlab/CODEOWNERS
        - scripts/ci/**/*
        - scripts/git-hooks/**/*
        - scripts/validation/contribution_safety_audit.py
        - scripts/validation/gitlab_ci_policy.py
        - scripts/validation/gitlab_governance_audit.py
        - scripts/validation/interface_inventory_audit.py
        - scripts/validation/interface_inventory_browser_audit.py
        - scripts/validation/reacs_registry.py
        - scripts/validation/reacs_registry.json
        - scripts/validation/reacs_specialization_exceptions.json
        - scripts/validation/release_gate.py
        - scripts/validation/validator_specialization_audit.py
      when: on_success
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
    - when: never

security_python_sca:
  <<: *sca_base
  stage: test
  timeout: 30m
  script:
    - rm -rf .sca-tools-venv
    - python3 -m venv .sca-tools-venv
    - '.sca-tools-venv/bin/python -m pip install --require-hashes --no-deps --only-binary=:all: -q -r scripts/security/requirements-sca.lock'
    - mkdir -p scripts/security/reports/python-materials
    - .sca-tools-venv/bin/pip-audit -r scripts/materials/requirements.lock --strict --no-deps --disable-pip --format cyclonedx-json --output scripts/security/reports/python-materials/python-env.raw.cdx.json
    - .sca-tools-venv/bin/python scripts/compliance/resolve_sbom_licenses.py --input scripts/security/reports/python-materials/python-env.raw.cdx.json --output scripts/security/reports/python-materials/python-env.cdx.json
    - .sca-tools-venv/bin/python scripts/security/audit_sbom_policy.py --sbom scripts/security/reports/python-materials/python-env.cdx.json --report scripts/security/reports/python-materials/sbom-policy.json
    - .sca-tools-venv/bin/python scripts/compliance/sbom_evidence.py --raw-sbom scripts/security/reports/python-materials/python-env.raw.cdx.json --raw-sbom-href python-env.raw.cdx.json --sbom scripts/security/reports/python-materials/python-env.cdx.json --artifact-name "python-material-tools-$CI_COMMIT_SHA" --record-id python-material-tooling --description "Pinned Python tools used to verify course materials; not distributed to learners" --distribution not-distributed --category validation --source-commit "$CI_COMMIT_SHA" --ci-job "$CI_JOB_NAME" --pipeline-url "$CI_PIPELINE_URL" --job-url "$CI_JOB_URL" --retention-days 30 --sbom-href python-env.cdx.json --appendix-href python-license-appendix.md --appendix-out scripts/security/reports/python-materials/python-license-appendix.md --manifest-out scripts/security/reports/python-materials/sbom-evidence.json
    - printf 'PYTHON_SCA_JOB_ID=%s\n' "$CI_JOB_ID" > scripts/security/reports/python-materials/job.env
  artifacts:
    when: always
    name: "security-python-sca-$CI_COMMIT_SHORT_SHA"
    paths:
      - scripts/security/reports/python-materials/
    reports:
      dotenv: scripts/security/reports/python-materials/job.env
    expire_in: 30 days
  rules:
    - if: '$COURSE_PRIVILEGED_PIPELINE == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - scripts/materials/requirements.txt
        - scripts/materials/requirements.lock
        - scripts/security/audit_python_dependencies.py
        - scripts/security/audit_vulnerability_waivers.py
        - scripts/security/audit_dependency_locks.py
        - scripts/security/audit_sbom_policy.py
        - scripts/security/requirements-sca.lock.in
        - scripts/security/requirements-sca.lock
        - scripts/security/run_full_sca.py
        - scripts/security/vulnerability-waivers.json
        - scripts/compliance/render_sbom_license_inventory.py
        - scripts/compliance/resolve_sbom_licenses.py
        - scripts/compliance/sbom_evidence.py
        - scripts/compliance/third_party_export_ui.js
        - scripts/compliance/docs/sbom_evidence.json
        - scripts/compliance/docs/ci_sbom_evidence.json
        - .gitlab/ci/sca.yml
      when: on_success
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
    - when: never
