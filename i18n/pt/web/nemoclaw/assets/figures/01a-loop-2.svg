<svg data-locale="pt-BR" class="gfx-dark" viewBox="0 78 840 222" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A mesma chamada de modelo sem estado, acessada por duas interfaces. Na API Chat Completions, você reenvia todo o array messages a cada turno e seu código mantém o histórico. Na API Responses, você envia apenas a nova entrada e uma referência, e o servidor mantém a conversa. Ambas alimentam o mesmo modelo sem estado, que recebe todo o contexto e retorna um turno do assistente (content, finish_reason e usage). A diferença é quem mantém a conversa entre os turnos." style="width:100%;max-width:1040px;height:auto;display:block;margin:1.2em auto;background:var(--gfx-bg);border:1px solid var(--gfx-line);border-radius:12px">
      <defs>
        <marker id="chat2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="var(--gfx-sub,#5e5e5e)"/></marker>
      </defs>
      <rect x="40" y="96" width="220" height="84" rx="14" fill="var(--gfx-tint-blue)" stroke="var(--gfx-blue)" stroke-width="2"/>
      <text x="150" y="124" text-anchor="middle" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--gfx-blue)" font-weight="800">Chat Completions</text>
      <text x="150" y="146" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--gfx-sub)">você reenvia todo o messages[]</text>
      <text x="150" y="164" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--gfx-sub)">seu código mantém o histórico</text>
      <rect x="40" y="206" width="220" height="84" rx="14" fill="var(--gfx-tint-teal)" stroke="var(--gfx-teal)" stroke-width="2"/>
      <text x="150" y="234" text-anchor="middle" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--gfx-teal)" font-weight="800">API Responses</text>
      <text x="150" y="256" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--gfx-sub)">você envia a entrada + uma referência</text>
      <text x="150" y="274" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--gfx-sub)">o servidor mantém a conversa</text>
      <rect x="336" y="132" width="168" height="112" rx="14" fill="var(--gfx-tint-purple)" stroke="var(--gfx-purple)" stroke-width="2"/>
      <text x="420" y="172" text-anchor="middle" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--gfx-purple)" font-weight="900">o modelo</text>
      <text x="420" y="196" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--gfx-sub)">chamada sem estado</text>
      <text x="420" y="214" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--gfx-sub)">contexto completo entra,</text>
      <text x="420" y="232" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--gfx-sub)">um turno sai</text>
      <rect x="580" y="132" width="224" height="112" rx="14" fill="var(--gfx-tint-green)" stroke="var(--gfx-green)" stroke-width="2"/>
      <text x="692" y="172" text-anchor="middle" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--gfx-green)" font-weight="800">um turno do assistente</text>
      <text x="692" y="196" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--gfx-sub)">message.content</text>
      <text x="692" y="214" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--gfx-sub)">finish_reason</text>
      <text x="692" y="232" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--gfx-sub)">usage</text>
      <path d="M 264 138 L 332 168" stroke="var(--gfx-sub)" stroke-width="2.2" fill="none" marker-end="url(#chat2-arrow)"/>
      <path d="M 264 248 L 332 210" stroke="var(--gfx-sub)" stroke-width="2.2" fill="none" marker-end="url(#chat2-arrow)"/>
      <path d="M 508 188 L 576 188" stroke="var(--gfx-sub)" stroke-width="2.2" fill="none" marker-end="url(#chat2-arrow)"/>
    </svg>
