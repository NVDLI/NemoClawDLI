<svg data-locale="pt-BR" class="gfx-dark" viewBox="0 0 1220 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Uma arquitetura RAG dividida em dois fluxos. No primeiro, a indexação ocorre offline: documentos são pré-processados, convertidos em embeddings e armazenados em um banco vetorial. No segundo, o atendimento ocorre ao vivo: a consulta chega ao aplicativo, é convertida em embedding e comparada ao banco; o contexto recuperado e a consulta seguem para o LLM, que transmite uma resposta fundamentada." preserveAspectRatio="xMidYMid meet" style="width:100%; height:auto; display:block; background:var(--gfx-bg,#0d0d0d); border:1px solid var(--gfx-line,#2a2a2a); border-radius:8px; padding:14px; max-width:1100px; margin:1.5rem auto">
