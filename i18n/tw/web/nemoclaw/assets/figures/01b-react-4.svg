<svg data-locale="zh-TW" class="gfx-dark" viewBox="0 74 760 305" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="“Lost in the Middle”，根據 Liu et al. 2023 年的研究重繪，並對映到代理程式不斷增長的 messages 陣列。U 形曲線展示答案準確率與所需文字在上下文中所處位置的關係。準確率在開頭和末尾較高：開頭固定著系統提示詞，末尾則是最新的工具結果；而中間位置的準確率降至最低。隨著迴圈不斷追加輪次，原始請求會從末端的新近位置被向左推入薄弱的中間區域，這就是上下文退化。" preserveAspectRatio="xMidYMid meet" style="width:100%;max-width:1040px;height:auto;display:block;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:8px;padding:14px;margin:1.4em auto">
      <defs><marker id="litm-arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="var(--gfx-sub,#9aa0a6)"/></marker></defs>
      <rect x="320" y="90" width="172" height="240" fill="var(--gfx-amber,#e3b341)" opacity="0.09"/>
      <line x1="100" y1="90" x2="100" y2="330" stroke="var(--gfx-sub,#5e5e5e)" stroke-width="1.5"/>
      <line x1="100" y1="330" x2="712" y2="330" stroke="var(--gfx-sub,#5e5e5e)" stroke-width="1.5"/>
      <text x="60" y="210" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="var(--gfx-sub,#9aa0a6)" transform="rotate(-90 60 210)">答案準確率</text>
      <text x="94" y="100" text-anchor="end" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="var(--gfx-sub,#5e5e5e)">較高</text>
      <text x="94" y="328" text-anchor="end" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="var(--gfx-sub,#5e5e5e)">較低</text>
      <path d="M 122 108 C 250 132, 332 306, 406 308 C 480 310, 562 132, 690 108" fill="none" stroke="var(--gfx-purple,#a78bfa)" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="122" cy="108" r="6" fill="var(--gfx-blue,#5aa8ff)"/>
      <circle cx="406" cy="308" r="6" fill="var(--gfx-amber,#e3b341)"/>
      <circle cx="690" cy="108" r="6" fill="var(--gfx-green,#9bd14a)"/>
      <line x1="582" y1="128" x2="382" y2="128" stroke="var(--gfx-sub,#9aa0a6)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#litm-arr)"/>
      <text x="482" y="116" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="var(--gfx-faint,#6b7177)">每一新輪次都會將請求向左推移</text>
      <text x="122" y="352" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="var(--gfx-sub,#9aa0a6)" font-weight="700">開頭</text>
      <text x="406" y="352" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="var(--gfx-sub,#9aa0a6)" font-weight="700">中間</text>
      <text x="690" y="352" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="var(--gfx-sub,#9aa0a6)" font-weight="700">末尾</text>
      <text x="122" y="372" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="var(--gfx-blue,#0969da)">系統提示詞</text>
      <text x="406" y="372" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="var(--gfx-amber,#9a6700)">原始請求</text>
      <text x="690" y="372" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="var(--gfx-green,#4a7a00)">最新的工具結果</text>
    </svg>
