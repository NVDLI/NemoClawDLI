<svg data-locale="zh-TW" class="gfx-dark" viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="觀察結果從環境流向代理程式。在代理程式內部，感知引導推理，推理引導行動。動作從代理程式流向環境。" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:8px;max-width:1000px;margin:1.5rem auto">
  <defs>
    <marker id="agent-loop-arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="var(--gfx-blue,#5aa8ff)"/>
    </marker>
    <marker id="agent-loop-arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="var(--gfx-green,#9bd14a)"/>
    </marker>
  </defs>

  <rect x="16" y="16" width="968" height="210" rx="14" fill="var(--gfx-panel,#17191c)" stroke="var(--gfx-green,#9bd14a)" stroke-width="2.4"/>
  <text x="500" y="56" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" font-weight="800" fill="var(--gfx-green,#9bd14a)">代理程式</text>

  <rect x="46" y="80" width="268" height="114" rx="10" fill="var(--gfx-bg,#0d0d0d)" stroke="var(--gfx-green,#9bd14a)" stroke-width="1.6"/>
  <text x="180" y="126" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" font-weight="700" fill="var(--gfx-ink,#e8eaed)"><tspan fill="var(--gfx-green,#9bd14a)">1.</tspan><tspan> 感知</tspan></text>
  <text x="180" y="162" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="var(--gfx-ink2,#c6cace)">收集它能得知的資訊</text>

  <rect x="366" y="80" width="268" height="114" rx="10" fill="var(--gfx-bg,#0d0d0d)" stroke="var(--gfx-green,#9bd14a)" stroke-width="1.6"/>
  <text x="500" y="126" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" font-weight="700" fill="var(--gfx-ink,#e8eaed)"><tspan fill="var(--gfx-green,#9bd14a)">2.</tspan><tspan> 推理</tspan></text>
  <text x="500" y="162" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="var(--gfx-ink2,#c6cace)">決定要做什麼</text>

  <rect x="686" y="80" width="268" height="114" rx="10" fill="var(--gfx-bg,#0d0d0d)" stroke="var(--gfx-green,#9bd14a)" stroke-width="1.6"/>
  <text x="820" y="126" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" font-weight="700" fill="var(--gfx-ink,#e8eaed)"><tspan fill="var(--gfx-green,#9bd14a)">3.</tspan><tspan> 行動</tspan></text>
  <text x="820" y="162" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="var(--gfx-ink2,#c6cace)">改變環境</text>

  <path d="M318 137 H360" fill="none" stroke="var(--gfx-green,#9bd14a)" stroke-width="2.8" marker-end="url(#agent-loop-arrow-green)"/>
  <path d="M638 137 H680" fill="none" stroke="var(--gfx-green,#9bd14a)" stroke-width="2.8" marker-end="url(#agent-loop-arrow-green)"/>

  <rect x="16" y="318" width="968" height="86" rx="14" fill="var(--gfx-panel,#17191c)" stroke="var(--gfx-blue,#5aa8ff)" stroke-width="2.4"/>
  <text x="500" y="371" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" font-weight="800" fill="var(--gfx-blue,#5aa8ff)">環境</text>

  <path d="M180 318 V199" fill="none" stroke="var(--gfx-blue,#5aa8ff)" stroke-width="2.8" marker-end="url(#agent-loop-arrow-blue)" data-flow-from="environment" data-flow-to="agent" data-flow-label="observation"/>
  <rect x="112" y="257" width="136" height="30" rx="15" fill="var(--gfx-bg,#0d0d0d)" stroke="var(--gfx-blue,#5aa8ff)" stroke-width="1"/>
  <text x="180" y="277" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" font-style="italic" fill="var(--gfx-blue,#5aa8ff)" data-flow-label="observation">觀察結果</text>

  <path d="M820 194 V313" fill="none" stroke="var(--gfx-green,#9bd14a)" stroke-width="2.8" marker-end="url(#agent-loop-arrow-green)" data-flow-from="agent" data-flow-to="environment" data-flow-label="action"/>
  <rect x="772" y="257" width="96" height="30" rx="15" fill="var(--gfx-bg,#0d0d0d)" stroke="var(--gfx-green,#9bd14a)" stroke-width="1"/>
  <text x="820" y="277" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" font-style="italic" fill="var(--gfx-green,#9bd14a)" data-flow-label="action">動作</text>
</svg>
