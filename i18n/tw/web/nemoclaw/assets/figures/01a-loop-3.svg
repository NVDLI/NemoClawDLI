<svg data-locale="zh-TW" class="gfx-dark" viewBox="0 70 920 450" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="以本機迴圈形式繪製的代理程式迴圈。第一步，locally-sample：讀取一部分環境。第二步，locally-perceive：將這一部分呈現為完整的工程化文字上下文。該上下文包含系統提示詞、訊息歷史記錄、先前的工具結果以及取樣片段，所有內容均為純文字。上下文以文字形式輸入一個無狀態的文字到文字對映，即 LLM，它是圖中唯一的模型；從感知到行動的過程被整合到這一對映中。模型輸出的是意圖訊號，即一種帶型別的工具呼叫，而非動作本身。第三步，locally-act：程式碼將意圖轉換為一次有明確邊界的本機環境更新。第四步，locally-impact：該更新改變世界，下一次本機取樣會讀取變化後的世界。除模型外，每個框都代表您編寫的程式碼；模型從不直接接觸世界，只會發出意圖，由迴圈決定是否執行。"
  preserveAspectRatio="xMidYMid meet"
  style="width:100%;height:auto;display:block;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:12px;padding:14px;">
<defs>
  <marker id="ll-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
    <path d="M0,1 L9,5 L0,9 Z" fill="var(--gfx-green,#9bd14a)"/>
  </marker>
  <marker id="ll-n" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
    <path d="M0,1 L9,5 L0,9 Z" fill="var(--gfx-sub,#9aa0a6)"/>
  </marker>
  <filter id="ll-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.45"/>
  </filter>
</defs>

<!-- header -->

<!-- ENVIRONMENT band (top), inset so the left return-lane has room -->
<rect x="150" y="84" width="710" height="78" rx="12" fill="var(--gfx-tint-blue,#15273d)" stroke="var(--gfx-line,#3a3f45)" stroke-width="1.6"/>
<text x="170" y="111" font-size="13" font-family="ui-monospace,monospace" fill="var(--gfx-blue,#5aa8ff)" font-weight="800">環境 · 唯一的持久狀態</text>
<text x="170" y="131" font-size="12" font-family="system-ui,sans-serif" fill="var(--gfx-sub,#9aa0a6)">一個迷宮單元格、一份聊天記錄、一個資料夾或一個沙箱。代理程式讀取其中一部分，並寫入其中一部分。</text>
<text x="170" y="149" font-size="12" font-family="system-ui,sans-serif" fill="var(--gfx-sub,#9aa0a6)">模型在輪次之間不會保留任何內容。連續性儲存在此處，即程式碼重新建置的上下文中。</text>

<!-- ① locally-sample : ENV down into CONTEXT -->
<path d="M 258 162 L 258 222" stroke="var(--gfx-sub,#9aa0a6)" stroke-width="2.2" fill="none" marker-end="url(#ll-n)"/>
<rect x="182" y="180" width="152" height="22" rx="11" fill="var(--gfx-panel,#17191c)" stroke="var(--gfx-line,#3a3f45)"/>
<text x="258" y="195" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="var(--gfx-ink2,#c6cace)">① 本機取樣</text>

<!-- CONTEXT card -->
<g filter="url(#ll-sh)"><rect x="150" y="228" width="210" height="170" rx="14" fill="var(--gfx-tint-blue,#15273d)" stroke="var(--gfx-blue,#5aa8ff)" stroke-width="2"/></g>
<text x="255" y="256" text-anchor="middle" font-size="14" font-family="ui-monospace,monospace" fill="var(--gfx-blue,#5aa8ff)" font-weight="800">工程化上下文</text>
<text x="255" y="274" text-anchor="middle" font-size="10" font-family="system-ui,sans-serif" fill="var(--gfx-sub,#9aa0a6)">② 本機感知將內容呈現至此</text>
<text x="255" y="300" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="var(--gfx-sub,#9aa0a6)">系統提示詞</text>
<text x="255" y="319" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="var(--gfx-sub,#9aa0a6)">歷史記錄 · messages[]</text>
<text x="255" y="338" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="var(--gfx-sub,#9aa0a6)">工具結果</text>
<text x="255" y="357" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="var(--gfx-sub,#9aa0a6)">取樣片段</text>
<text x="255" y="382" text-anchor="middle" font-size="10.5" font-family="system-ui,sans-serif" fill="var(--gfx-sub,#9aa0a6)" font-style="italic">全部採用純文字形式</text>

<!-- text into model -->
<path d="M 360 313 L 416 313" stroke="var(--gfx-green,#9bd14a)" stroke-width="2.4" fill="none" marker-end="url(#ll-g)"/>
<text x="388" y="303" text-anchor="middle" font-size="10" font-family="ui-monospace,monospace" fill="var(--gfx-green,#9bd14a)">文字 →</text>

<!-- MODEL card (center) -->
<g filter="url(#ll-sh)"><rect x="418" y="228" width="200" height="170" rx="14" fill="var(--gfx-panel,#17191c)" stroke="var(--gfx-green,#9bd14a)" stroke-width="2.4"/></g>
<text x="518" y="256" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="var(--gfx-green,#9bd14a)" letter-spacing="1">推理 SOCKET</text>
<text x="518" y="298" text-anchor="middle" font-size="22" font-family="ui-monospace,monospace" fill="var(--gfx-ink,#e8eaed)" font-weight="900">LLM</text>
<text x="518" y="324" text-anchor="middle" font-size="12" font-family="ui-monospace,monospace" fill="var(--gfx-ink2,#c6cace)">無狀態 · 文字 → 文字</text>
<text x="518" y="356" text-anchor="middle" font-size="10.5" font-family="system-ui,sans-serif" fill="var(--gfx-sub,#9aa0a6)" font-style="italic">感知 → 行動，整合</text>
<text x="518" y="373" text-anchor="middle" font-size="10.5" font-family="system-ui,sans-serif" fill="var(--gfx-sub,#9aa0a6)" font-style="italic">為單一對映</text>

<!-- text out of model -->
<path d="M 618 313 L 674 313" stroke="var(--gfx-green,#9bd14a)" stroke-width="2.4" fill="none" marker-end="url(#ll-g)"/>
<text x="646" y="303" text-anchor="middle" font-size="10" font-family="ui-monospace,monospace" fill="var(--gfx-green,#9bd14a)">→ 文字</text>

<!-- INTENT card (right) -->
<g filter="url(#ll-sh)"><rect x="676" y="228" width="184" height="170" rx="14" fill="var(--gfx-tint-amber,#33280f)" stroke="var(--gfx-amber,#e3b341)" stroke-width="2"/></g>
<text x="768" y="256" text-anchor="middle" font-size="14" font-family="ui-monospace,monospace" fill="var(--gfx-amber,#e3b341)" font-weight="800">意圖訊號</text>
<text x="768" y="282" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="var(--gfx-amber,#e3b341)">型別化工具呼叫</text>
<text x="768" y="306" text-anchor="middle" font-size="12" font-family="ui-monospace,monospace" fill="var(--gfx-amber,#e3b341)">{ "move":"east" }</text>
<text x="768" y="338" text-anchor="middle" font-size="10.5" font-family="system-ui,sans-serif" fill="var(--gfx-sub,#9aa0a6)">尚未執行操作。</text>
<text x="768" y="355" text-anchor="middle" font-size="10.5" font-family="system-ui,sans-serif" fill="var(--gfx-sub,#9aa0a6)">一個操作請求，</text>
<text x="768" y="372" text-anchor="middle" font-size="10.5" font-family="system-ui,sans-serif" fill="var(--gfx-sub,#9aa0a6)">接下來由程式碼讀取</text>

<!-- ③ locally-act : INTENT down, left along bottom lane to UPDATE -->
<path d="M 768 398 L 768 456 L 552 456" stroke="var(--gfx-sub,#9aa0a6)" stroke-width="2.2" fill="none" marker-end="url(#ll-n)"/>
<rect x="660" y="434" width="148" height="22" rx="11" fill="var(--gfx-panel,#17191c)" stroke="var(--gfx-line,#3a3f45)"/>
<text x="734" y="449" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="var(--gfx-ink2,#c6cace)">③ 本機執行</text>

<!-- ENV UPDATE card (bottom center) -->
<g filter="url(#ll-sh)"><rect x="266" y="424" width="286" height="92" rx="14" fill="var(--gfx-tint-green,#1d2a12)" stroke="var(--gfx-green,#9bd14a)" stroke-width="2"/></g>
<text x="409" y="453" text-anchor="middle" font-size="14" font-family="ui-monospace,monospace" fill="var(--gfx-green,#9bd14a)" font-weight="800">更新本機環境</text>
<text x="409" y="477" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="var(--gfx-sub,#9aa0a6)">doMove(grid, pos, intent.move)</text>
<text x="409" y="499" text-anchor="middle" font-size="10.5" font-family="system-ui,sans-serif" fill="var(--gfx-sub,#9aa0a6)" font-style="italic">程式碼在驗證並限制範圍後執行該意圖</text>

<!-- ④ locally-impact : UPDATE left, up the dedicated left lane (x=90) to ENV band -->
<path d="M 266 470 L 90 470 L 90 123 L 148 123" stroke="var(--gfx-green,#9bd14a)" stroke-width="2.4" fill="none" marker-end="url(#ll-g)"/>
<g transform="rotate(-90 90 300)">
  <rect x="16" y="289" width="148" height="22" rx="11" fill="var(--gfx-panel,#17191c)" stroke="var(--gfx-line,#3a3f45)"/>
  <text x="90" y="304" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="var(--gfx-green,#9bd14a)">④ 本機影響</text>
</g>

<!-- footer -->
</svg>
