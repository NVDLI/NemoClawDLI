<svg data-locale="zh-TW" class="gfx-dark" viewBox="0 0 1020 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Russell 和 Norvig 提出的四種代理程式架構：反射型、基於目標型、基於效用型和學習型代理程式。每種架構均用三行文字說明其核心思想，並配有一個小型框圖，展示從感測器經推理到執行器的內部資料流。" preserveAspectRatio="xMidYMid meet" style="width:100%; max-width:1400px; height:auto; display:block; margin:1.5rem auto; border-radius:12px">
    <defs>
      <marker id="matrix-arr-v" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
        <path d="M0,2 L8,5 L0,8 Z" fill="var(--gfx-faint,#8b949e)"/>
      </marker>
      <marker id="matrix-arr-green-v" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
        <path d="M0,2 L8,5 L0,8 Z" fill="var(--gfx-green,#9bd14a)"/>
      </marker>
      <marker id="matrix-arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
        <path d="M0,2 L8,5 L0,8 Z" fill="var(--gfx-blue,#5aa8ff)"/>
      </marker>
    </defs>

    <rect x="0" y="0" width="1020" height="400" rx="12" fill="var(--gfx-bg,#0d0d0d)" stroke="var(--gfx-line,#3a3f45)" stroke-width="1"/>

    <rect x="30" y="25" width="480" height="145" rx="8" fill="var(--gfx-panel,#17191c)" stroke="var(--gfx-line,#3a3f45)" stroke-width="1.5"/>
    <text x="50" y="52" font-family="ui-monospace, monospace" font-size="13.5" fill="var(--gfx-green,#9bd14a)" font-weight="700">01 . 反射型代理程式</text>

    <text x="50" y="78" font-family="Arial, sans-serif" font-size="12" fill="var(--gfx-sub,#9aa0a6)">• 將輸入直接對映為動作，不考慮歷史記錄。</text>
    <text x="50" y="96" font-family="Arial, sans-serif" font-size="12" fill="var(--gfx-sub,#9aa0a6)">• 使用規則將條件狀態與行為相匹配。</text>
    <text x="50" y="114" font-family="Arial, sans-serif" font-size="12" fill="var(--gfx-sub,#9aa0a6)">• 保留狀態記憶以填補上下文缺口。</text>

    <g class="reflex-diagram" transform="translate(320, 46) scale(1.2)">
      <rect x="0" y="0" width="90" height="20" rx="3" fill="var(--gfx-bg,#0d0d0d)" stroke="var(--gfx-blue,#5aa8ff)" stroke-width="1"/>
      <text x="45" y="13" font-family="ui-monospace, monospace" font-size="9" fill="var(--gfx-blue,#5aa8ff)" text-anchor="middle">感測器</text>

      <rect x="0" y="32" width="90" height="20" rx="3" fill="var(--gfx-bg,#0d0d0d)" stroke="var(--gfx-line,#3a3f45)" stroke-width="1"/>
      <text x="45" y="45" font-family="Arial, sans-serif" font-size="9" fill="var(--gfx-sub,#9aa0a6)" text-anchor="middle">狀態 / 規則</text>

      <rect x="0" y="64" width="90" height="20" rx="3" fill="var(--gfx-bg,#0d0d0d)" stroke="var(--gfx-green,#9bd14a)" stroke-width="1"/>
      <text x="45" y="77" font-family="ui-monospace, monospace" font-size="9" fill="var(--gfx-green,#9bd14a)" text-anchor="middle">執行器</text>

      <line x1="45" y1="20" x2="45" y2="32" stroke="var(--gfx-faint,#8b949e)" stroke-width="1.2" marker-end="url(#matrix-arr-v)"/>
      <line x1="45" y1="52" x2="45" y2="64" stroke="var(--gfx-green,#9bd14a)" stroke-width="1.2" marker-end="url(#matrix-arr-green-v)"/>

      <path d="M 90 10 C 100 16, 112 48, 92 64" fill="none" stroke="var(--gfx-blue,#5aa8ff)" stroke-width="1" stroke-dasharray="2 2" marker-end="url(#matrix-arr-blue)"/>
      <text x="124" y="34" font-family="Arial, sans-serif" font-size="10" fill="var(--gfx-blue,#5aa8ff)" text-anchor="middle">無狀態</text>
      <text x="124" y="45" font-family="Arial, sans-serif" font-size="10" fill="var(--gfx-blue,#5aa8ff)" text-anchor="middle">旁路</text>
    </g>


    <rect x="525" y="25" width="465" height="145" rx="8" fill="var(--gfx-panel,#17191c)" stroke="var(--gfx-line,#3a3f45)" stroke-width="1.5"/>
    <text x="545" y="52" font-family="ui-monospace, monospace" font-size="13.5" fill="var(--gfx-green,#9bd14a)" font-weight="700">02 . 基於目標的代理程式</text>

    <text x="545" y="78" font-family="Arial, sans-serif" font-size="12" fill="var(--gfx-sub,#9aa0a6)">• 將世界狀態跟蹤與明確目標相結合。</text>
    <text x="545" y="96" font-family="Arial, sans-serif" font-size="12" fill="var(--gfx-sub,#9aa0a6)">• 前瞻評估成功路徑。</text>
    <text x="545" y="114" font-family="Arial, sans-serif" font-size="12" fill="var(--gfx-sub,#9aa0a6)">• 以規劃迴圈取代簡單反射。</text>

    <g class="goal-diagram" transform="translate(845, 46) scale(1.2)">
      <rect x="0" y="0" width="95" height="20" rx="3" fill="var(--gfx-bg,#0d0d0d)" stroke="var(--gfx-blue,#5aa8ff)" stroke-width="1"/>
      <text x="47.5" y="13" font-family="ui-monospace, monospace" font-size="9" fill="var(--gfx-blue,#5aa8ff)" text-anchor="middle">感測器 / 模型</text>

      <rect x="0" y="32" width="95" height="20" rx="3" fill="var(--gfx-tint-sub,#1c1f22)" stroke="var(--gfx-line,#3a3f45)" stroke-width="1"/>
      <text x="47.5" y="45" font-family="Arial, sans-serif" font-size="9" fill="var(--gfx-ink,#e8eaed)" text-anchor="middle">目標 / 規劃</text>

      <rect x="0" y="64" width="95" height="20" rx="3" fill="var(--gfx-bg,#0d0d0d)" stroke="var(--gfx-green,#9bd14a)" stroke-width="1"/>
      <text x="47.5" y="77" font-family="ui-monospace, monospace" font-size="9" fill="var(--gfx-green,#9bd14a)" text-anchor="middle">執行器</text>

      <line x1="47.5" y1="20" x2="47.5" y2="32" stroke="var(--gfx-faint,#8b949e)" stroke-width="1.2" marker-end="url(#matrix-arr-v)"/>
      <line x1="47.5" y1="52" x2="47.5" y2="64" stroke="var(--gfx-green,#9bd14a)" stroke-width="1.2" marker-end="url(#matrix-arr-green-v)"/>
    </g>


    <rect x="30" y="195" width="465" height="145" rx="8" fill="var(--gfx-panel,#17191c)" stroke="var(--gfx-line,#3a3f45)" stroke-width="1.5"/>
    <text x="50" y="222" font-family="ui-monospace, monospace" font-size="13.5" fill="var(--gfx-green,#9bd14a)" font-weight="700">03 . 基於效用的代理程式</text>

    <text x="50" y="248" font-family="Arial, sans-serif" font-size="12" fill="var(--gfx-sub,#9aa0a6)">• 使用偏好分數評定世界狀態。</text>
    <text x="50" y="266" font-family="Arial, sans-serif" font-size="12" fill="var(--gfx-sub,#9aa0a6)">• 權衡相互衝突的目標。</text>
    <text x="50" y="284" font-family="Arial, sans-serif" font-size="12" fill="var(--gfx-sub,#9aa0a6)">• 在不確定性下最大化期望效用。</text>

    <g class="utility-diagram" transform="translate(320, 216) scale(1.2)">
      <rect x="0" y="0" width="90" height="20" rx="3" fill="var(--gfx-bg,#0d0d0d)" stroke="var(--gfx-blue,#5aa8ff)" stroke-width="1"/>
      <text x="45" y="13" font-family="ui-monospace, monospace" font-size="9" fill="var(--gfx-blue,#5aa8ff)" text-anchor="middle">感測器 / 模型</text>

      <rect x="0" y="32" width="90" height="20" rx="3" fill="var(--gfx-tint-green,#1d2a12)" stroke="var(--gfx-green,#9bd14a)" stroke-width="1"/>
      <text x="45" y="45" font-family="ui-monospace, monospace" font-size="9" fill="var(--gfx-green,#9bd14a)" font-weight="700" text-anchor="middle">效用 U(s)</text>

      <rect x="0" y="64" width="90" height="20" rx="3" fill="var(--gfx-bg,#0d0d0d)" stroke="var(--gfx-green,#9bd14a)" stroke-width="1"/>
      <text x="45" y="77" font-family="ui-monospace, monospace" font-size="9" fill="var(--gfx-green,#9bd14a)" text-anchor="middle">執行器</text>

      <line x1="45" y1="20" x2="45" y2="32" stroke="var(--gfx-faint,#8b949e)" stroke-width="1.2" marker-end="url(#matrix-arr-v)"/>
      <line x1="45" y1="52" x2="45" y2="64" stroke="var(--gfx-green,#9bd14a)" stroke-width="1.2" marker-end="url(#matrix-arr-green-v)"/>
    </g>


    <rect x="525" y="195" width="465" height="145" rx="8" fill="var(--gfx-panel,#17191c)" stroke="var(--gfx-green,#9bd14a)" stroke-width="1.5"/>
    <text x="545" y="222" font-family="ui-monospace, monospace" font-size="13.5" fill="var(--gfx-green,#9bd14a)" font-weight="700">04 . 學習型代理程式</text>

    <text x="545" y="248" font-family="Arial, sans-serif" font-size="12" fill="var(--gfx-sub,#9aa0a6)">• 將執行要素與評估要素分離。</text>
    <text x="545" y="266" font-family="Arial, sans-serif" font-size="12" fill="var(--gfx-sub,#9aa0a6)">• 評判器依據引數檢查選擇。</text>
    <text x="545" y="284" font-family="Arial, sans-serif" font-size="12" fill="var(--gfx-sub,#9aa0a6)">• 動態修改自身程式以持續改進。</text>

    <g class="learning-diagram" transform="translate(845, 216) scale(1.2)">
      <rect x="0" y="0" width="95" height="20" rx="3" fill="var(--gfx-bg,#0d0d0d)" stroke="var(--gfx-line,#3a3f45)" stroke-width="1"/>
      <text x="47.5" y="13" font-family="Arial, sans-serif" font-size="9" fill="var(--gfx-ink,#e8eaed)" text-anchor="middle">評判器檢查</text>

      <rect x="0" y="32" width="95" height="20" rx="3" fill="var(--gfx-tint-green,#1d2a12)" stroke="var(--gfx-green,#9bd14a)" stroke-width="1"/>
      <text x="47.5" y="45" font-family="ui-monospace, monospace" font-size="9" fill="var(--gfx-green,#9bd14a)" font-weight="700" text-anchor="middle">學習要素</text>

      <rect x="0" y="64" width="95" height="20" rx="3" fill="var(--gfx-bg,#0d0d0d)" stroke="var(--gfx-line,#3a3f45)" stroke-width="1"/>
      <text x="47.5" y="77" font-family="Arial, sans-serif" font-size="9" fill="var(--gfx-ink,#e8eaed)" text-anchor="middle">效能執行</text>

      <line x1="47.5" y1="20" x2="47.5" y2="32" stroke="var(--gfx-green,#9bd14a)" stroke-width="1.2" marker-end="url(#matrix-arr-green-v)"/>
      <line x1="47.5" y1="52" x2="47.5" y2="64" stroke="var(--gfx-green,#9bd14a)" stroke-width="1.2" marker-end="url(#matrix-arr-green-v)"/>
    </g>
  </svg>
