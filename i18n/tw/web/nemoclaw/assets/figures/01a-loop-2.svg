<svg data-locale="zh-TW" class="gfx-dark" viewBox="0 78 840 222" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="透過兩種介面存取同一個無狀態模型呼叫。Chat Completions API：您需要在每一輪重新傳送完整的 messages 陣列，並由程式碼儲存歷史記錄。Responses API：您只需傳送新輸入和一個引用，由伺服器儲存會話執行緒。兩者都會將內容傳給同一個無狀態模型；該模型接收完整上下文並傳回一輪助手回應（content、finish_reason、usage）。兩者的唯一區別是由誰在輪次之間儲存對話。" style="width:100%;max-width:1040px;height:auto;display:block;margin:1.2em auto;background:var(--gfx-bg);border:1px solid var(--gfx-line);border-radius:12px">
      <defs>
        <marker id="chat2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="var(--gfx-sub,#5e5e5e)"/></marker>
      </defs>
      <rect x="40" y="96" width="220" height="84" rx="14" fill="var(--gfx-tint-blue)" stroke="var(--gfx-blue)" stroke-width="2"/>
      <text x="150" y="124" text-anchor="middle" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--gfx-blue)" font-weight="800">Chat Completions</text>
      <text x="150" y="146" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--gfx-sub)">您重新傳送所有 messages[]</text>
      <text x="150" y="164" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--gfx-sub)">程式碼儲存歷史記錄</text>
      <rect x="40" y="206" width="220" height="84" rx="14" fill="var(--gfx-tint-teal)" stroke="var(--gfx-teal)" stroke-width="2"/>
      <text x="150" y="234" text-anchor="middle" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--gfx-teal)" font-weight="800">Responses API</text>
      <text x="150" y="256" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--gfx-sub)">您傳送輸入 + 一個引用</text>
      <text x="150" y="274" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--gfx-sub)">伺服器儲存會話執行緒</text>
      <rect x="336" y="132" width="168" height="112" rx="14" fill="var(--gfx-tint-purple)" stroke="var(--gfx-purple)" stroke-width="2"/>
      <text x="420" y="172" text-anchor="middle" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--gfx-purple)" font-weight="900">模型</text>
      <text x="420" y="196" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--gfx-sub)">無狀態呼叫</text>
      <text x="420" y="214" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--gfx-sub)">輸入完整上下文，</text>
      <text x="420" y="232" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--gfx-sub)">輸出一個輪次</text>
      <rect x="580" y="132" width="224" height="112" rx="14" fill="var(--gfx-tint-green)" stroke="var(--gfx-green)" stroke-width="2"/>
      <text x="692" y="172" text-anchor="middle" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--gfx-green)" font-weight="800">一輪助手回應</text>
      <text x="692" y="196" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--gfx-sub)">message.content</text>
      <text x="692" y="214" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--gfx-sub)">finish_reason</text>
      <text x="692" y="232" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--gfx-sub)">usage</text>
      <path d="M 264 138 L 332 168" stroke="var(--gfx-sub)" stroke-width="2.2" fill="none" marker-end="url(#chat2-arrow)"/>
      <path d="M 264 248 L 332 210" stroke="var(--gfx-sub)" stroke-width="2.2" fill="none" marker-end="url(#chat2-arrow)"/>
      <path d="M 508 188 L 576 188" stroke="var(--gfx-sub)" stroke-width="2.2" fill="none" marker-end="url(#chat2-arrow)"/>
    </svg>
