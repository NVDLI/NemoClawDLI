<!DOCTYPE html>
<html lang="es-ES">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Creación de agentes</title>
<style>
  /* Self-contained: this web/-root stub does not depend on a course stylesheet. */
  :root {
    --g:#76b900; --bg:#0d0d0d; --e1:#161616; --e3:#2a2a2a;
    --tx:#f2f2f2; --td:#b0b0b0;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --g:#3f6900; --bg:#ffffff; --e1:#f6f8fa; --e3:#e1e6eb;
    --tx:#1a1a1a; --td:#3b3b3b; color-scheme:light;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]):not([data-theme="light"]) {
      --g:#3f6900; --bg:#ffffff; --e1:#f6f8fa; --e3:#e1e6eb;
      --tx:#1a1a1a; --td:#3b3b3b; color-scheme:light;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--tx);
               font-family: var(--sans); font-size: 15px; line-height: 1.55; }
  a { color: var(--g); text-decoration: none; }
  a:hover { text-decoration: underline; }
  main { max-width: min(62.5rem,100%); margin: 0 auto;
         padding: clamp(1.5rem,4vw,2.5rem) clamp(1rem,4vw,2rem) 80px; }
  .hero { margin: .8em 0 2em; }
  .hero h1 { font-size: 2.6rem; font-weight: 700; line-height: 1.1;
             margin: 0 0 .4em; letter-spacing: -0.01em; }
  .hero h1 span { color: var(--g); }
  .hero p.lead { font-size: 1.08rem; color: var(--td); }
  .callout { background: var(--e1); border: 1px solid var(--e3);
             border-radius: 12px;
             padding: 18px 22px; }
</style>
</head>
<body>
<main>

<div class="hero">
  <h1>Creación de <span>agentes</span></h1>
  <p class="lead">Esta página cambió de dirección. Vuelve al curso y continúa donde lo dejaste.</p>
</div>

<div class="callout" style="margin-top: 18px;"><a href="/lab/static/index.html">Volver al inicio del curso &rarr;</a></div>

</main>
</body>
</html>
