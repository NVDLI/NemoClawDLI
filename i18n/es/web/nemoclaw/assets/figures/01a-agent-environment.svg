<svg data-locale="es-ES" class="gfx-dark" viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Las observaciones fluyen del entorno al agente. Dentro del agente, la percepción conduce al razonamiento y el razonamiento conduce a la acción. Las acciones fluyen del agente al entorno." preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:8px;max-width:1000px;margin:1.5rem auto">
  <defs>
    <marker id="agent-loop-arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="var(--gfx-blue,#5aa8ff)"/>
    </marker>
    <marker id="agent-loop-arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="var(--gfx-green,#9bd14a)"/>
    </marker>
  </defs>

  <rect x="16" y="16" width="968" height="210" rx="14" fill="var(--gfx-panel,#17191c)" stroke="var(--gfx-green,#9bd14a)" stroke-width="2.4"/>
  <text x="500" y="56" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" font-weight="800" fill="var(--gfx-green,#9bd14a)">Agente</text>

  <rect x="46" y="80" width="268" height="114" rx="10" fill="var(--gfx-bg,#0d0d0d)" stroke="var(--gfx-green,#9bd14a)" stroke-width="1.6"/>
  <text x="180" y="126" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" font-weight="700" fill="var(--gfx-ink,#e8eaed)"><tspan fill="var(--gfx-green,#9bd14a)">1.</tspan><tspan> Percepción</tspan></text>
  <text x="180" y="162" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="var(--gfx-ink2,#c6cace)">reúne lo que puede saber</text>

  <rect x="366" y="80" width="268" height="114" rx="10" fill="var(--gfx-bg,#0d0d0d)" stroke="var(--gfx-green,#9bd14a)" stroke-width="1.6"/>
  <text x="500" y="126" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" font-weight="700" fill="var(--gfx-ink,#e8eaed)"><tspan fill="var(--gfx-green,#9bd14a)">2.</tspan><tspan> Razonamiento</tspan></text>
  <text x="500" y="162" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="var(--gfx-ink2,#c6cace)">elige qué hacer</text>

  <rect x="686" y="80" width="268" height="114" rx="10" fill="var(--gfx-bg,#0d0d0d)" stroke="var(--gfx-green,#9bd14a)" stroke-width="1.6"/>
  <text x="820" y="126" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" font-weight="700" fill="var(--gfx-ink,#e8eaed)"><tspan fill="var(--gfx-green,#9bd14a)">3.</tspan><tspan> Acción</tspan></text>
  <text x="820" y="162" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="var(--gfx-ink2,#c6cace)">cambia el entorno</text>

  <path d="M318 137 H360" fill="none" stroke="var(--gfx-green,#9bd14a)" stroke-width="2.8" marker-end="url(#agent-loop-arrow-green)"/>
  <path d="M638 137 H680" fill="none" stroke="var(--gfx-green,#9bd14a)" stroke-width="2.8" marker-end="url(#agent-loop-arrow-green)"/>

  <rect x="16" y="318" width="968" height="86" rx="14" fill="var(--gfx-panel,#17191c)" stroke="var(--gfx-blue,#5aa8ff)" stroke-width="2.4"/>
  <text x="500" y="371" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" font-weight="800" fill="var(--gfx-blue,#5aa8ff)">Entorno</text>

  <path d="M180 318 V199" fill="none" stroke="var(--gfx-blue,#5aa8ff)" stroke-width="2.8" marker-end="url(#agent-loop-arrow-blue)" data-flow-from="environment" data-flow-to="agent" data-flow-label="observation"/>
  <rect x="112" y="257" width="136" height="30" rx="15" fill="var(--gfx-bg,#0d0d0d)" stroke="var(--gfx-blue,#5aa8ff)" stroke-width="1"/>
  <text x="180" y="277" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" font-style="italic" fill="var(--gfx-blue,#5aa8ff)" data-flow-label="observation">observación</text>

  <path d="M820 194 V313" fill="none" stroke="var(--gfx-green,#9bd14a)" stroke-width="2.8" marker-end="url(#agent-loop-arrow-green)" data-flow-from="agent" data-flow-to="environment" data-flow-label="action"/>
  <rect x="772" y="257" width="96" height="30" rx="15" fill="var(--gfx-bg,#0d0d0d)" stroke="var(--gfx-green,#9bd14a)" stroke-width="1"/>
  <text x="820" y="277" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" font-style="italic" fill="var(--gfx-green,#9bd14a)" data-flow-label="action">acción</text>
</svg>
