<svg data-locale="es-ES" class="gfx-dark" viewBox="0 0 860 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Las observaciones fluyen del entorno al agente. Las acciones fluyen del agente al entorno." preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:8px;max-width:860px;margin:1.5rem auto">
  <defs>
    <marker id="env-agent-arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="var(--gfx-blue,#5aa8ff)"/>
    </marker>
    <marker id="env-agent-arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="var(--gfx-green,#9bd14a)"/>
    </marker>
  </defs>

  <rect x="30" y="32" width="340" height="210" rx="12" fill="var(--gfx-panel,#17191c)" stroke="var(--gfx-blue,#5aa8ff)" stroke-width="2.4"/>
  <text x="200" y="78" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="24" font-weight="800" fill="var(--gfx-blue,#5aa8ff)">Medio ambiente</text>
  <path d="M70 101 H330" stroke="var(--gfx-blue,#5aa8ff)" stroke-width="1.2" opacity="0.35"/>
  <text x="200" y="133" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="var(--gfx-ink2,#c6cace)">estado del mundo</text>
  <text x="200" y="162" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="var(--gfx-ink2,#c6cace)">los sensores lo leen</text>
  <text x="200" y="191" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="var(--gfx-ink2,#c6cace)">acciones alteran el estado</text>

  <rect x="490" y="32" width="340" height="210" rx="12" fill="var(--gfx-panel,#17191c)" stroke="var(--gfx-green,#9bd14a)" stroke-width="2.4"/>
  <text x="660" y="78" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="24" font-weight="800" fill="var(--gfx-green,#9bd14a)">Agente</text>
  <path d="M530 101 H790" stroke="var(--gfx-green,#9bd14a)" stroke-width="1.2" opacity="0.35"/>
  <text x="660" y="133" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="var(--gfx-ink2,#c6cace)">percibe el mundo</text>
  <text x="660" y="162" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="var(--gfx-ink2,#c6cace)">elige la siguiente acción</text>
  <text x="660" y="191" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="var(--gfx-ink2,#c6cace)">actúa sobre el mundo</text>

  <path d="M370 108 C 410 82, 450 82, 490 108" fill="none" stroke="var(--gfx-blue,#5aa8ff)" stroke-width="2.8" marker-end="url(#env-agent-arrow-blue)" data-flow-from="environment" data-flow-to="agent" data-flow-label="observation"/>
  <rect x="378" y="56" width="104" height="28" rx="14" fill="var(--gfx-bg,#0d0d0d)" stroke="var(--gfx-blue,#5aa8ff)" stroke-width="1"/>
  <text x="430" y="75" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-style="italic" fill="var(--gfx-blue,#5aa8ff)" data-flow-label="observation">observación</text>

  <path d="M490 174 C 450 200, 410 200, 370 174" fill="none" stroke="var(--gfx-green,#9bd14a)" stroke-width="2.8" marker-end="url(#env-agent-arrow-green)" data-flow-from="agent" data-flow-to="environment" data-flow-label="action"/>
  <rect x="399" y="200" width="62" height="28" rx="14" fill="var(--gfx-bg,#0d0d0d)" stroke="var(--gfx-green,#9bd14a)" stroke-width="1"/>
  <text x="430" y="219" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-style="italic" fill="var(--gfx-green,#9bd14a)" data-flow-label="action">acción</text>
</svg>
