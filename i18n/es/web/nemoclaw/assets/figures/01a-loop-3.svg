<svg data-locale="es-ES" class="gfx-dark" viewBox="0 70 920 450" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="El ciclo del agente, representado de forma local. Primero, muestrear: leer una parte del entorno. Segundo, percibir: convertir esa muestra en un contexto textual preparado, formado por el prompt de sistema, el historial, resultados anteriores de herramientas y la propia muestra. Ese texto alimenta una sola transformación sin estado, el LLM, que condensa el paso de percibir a actuar. Su salida es una intención: una llamada a herramienta tipada, no la acción. Tercero, actuar: el código convierte la intención en una actualización local y limitada. Cuarto, producir impacto: la actualización cambia el entorno y la muestra siguiente lee el nuevo estado. Todos los cuadros salvo el modelo representan código; el modelo no toca el mundo, solo emite una intención que el ciclo decide ejecutar."
  preserveAspectRatio="xMidYMid meet"
  style="width:100%;height:auto;display:block;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:12px;padding:14px;">
<defs>
  <marker id="ll-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
    <path d="M0,1 L9,5 L0,9 Z" fill="var(--gfx-green,#9bd14a)"/>
  </marker>
  <marker id="ll-n" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
    <path d="M0,1 L9,5 L0,9 Z" fill="var(--gfx-sub,#9aa0a6)"/>
  </marker>
  <filter id="ll-sh" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.45"/>
  </filter>
</defs>

<!-- header -->

<!-- ENVIRONMENT band (top), inset so the left return-lane has room -->
<rect x="150" y="84" width="710" height="78" rx="12" fill="var(--gfx-tint-blue,#15273d)" stroke="var(--gfx-line,#3a3f45)" stroke-width="1.6"/>
<text x="170" y="111" font-size="13" font-family="ui-monospace,monospace" fill="var(--gfx-blue,#5aa8ff)" font-weight="800">AMBIENTE · el único estado persistente</text>
<text x="170" y="131" font-size="12" font-family="system-ui,sans-serif" fill="var(--gfx-sub,#9aa0a6)">Una celda del laberinto, una conversación, una carpeta de archivos, un sandbox. El agente lee y graba una parte.</text>
<text x="170" y="149" font-size="12" font-family="system-ui,sans-serif" fill="var(--gfx-sub,#9aa0a6)">Nada persiste en el modelo entre turnos. La continuidad vive en el contexto que reconstruye el código.</text>

<!-- ① locally-sample : ENV down into CONTEXT -->
<path d="M 258 162 L 258 222" stroke="var(--gfx-sub,#9aa0a6)" stroke-width="2.2" fill="none" marker-end="url(#ll-n)"/>
<rect x="182" y="180" width="152" height="22" rx="11" fill="var(--gfx-panel,#17191c)" stroke="var(--gfx-line,#3a3f45)"/>
<text x="258" y="195" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="var(--gfx-ink2,#c6cace)">1 muestrear localmente</text>

<!-- CONTEXT card -->
<g filter="url(#ll-sh)"><rect x="150" y="228" width="210" height="170" rx="14" fill="var(--gfx-tint-blue,#15273d)" stroke="var(--gfx-blue,#5aa8ff)" stroke-width="2"/></g>
<text x="255" y="256" text-anchor="middle" font-size="14" font-family="ui-monospace,monospace" fill="var(--gfx-blue,#5aa8ff)" font-weight="800">contexto preparado</text>
<text x="255" y="274" text-anchor="middle" font-size="10" font-family="system-ui,sans-serif" fill="var(--gfx-sub,#9aa0a6)">2 percibir localmente produce este contexto</text>
<text x="255" y="300" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="var(--gfx-sub,#9aa0a6)">prompt de sistema</text>
<text x="255" y="319" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="var(--gfx-sub,#9aa0a6)">historial · messages[]</text>
<text x="255" y="338" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="var(--gfx-sub,#9aa0a6)">resultados de herramientas</text>
<text x="255" y="357" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="var(--gfx-sub,#9aa0a6)">la muestra del entorno</text>
<text x="255" y="382" text-anchor="middle" font-size="10.5" font-family="system-ui,sans-serif" fill="var(--gfx-sub,#9aa0a6)" font-style="italic">Todo en texto sencillo</text>

<!-- text into model -->
<path d="M 360 313 L 416 313" stroke="var(--gfx-green,#9bd14a)" stroke-width="2.4" fill="none" marker-end="url(#ll-g)"/>
<text x="388" y="303" text-anchor="middle" font-size="10" font-family="ui-monospace,monospace" fill="var(--gfx-green,#9bd14a)">texto →</text>

<!-- MODEL card (center) -->
<g filter="url(#ll-sh)"><rect x="418" y="228" width="200" height="170" rx="14" fill="var(--gfx-panel,#17191c)" stroke="var(--gfx-green,#9bd14a)" stroke-width="2.4"/></g>
<text x="518" y="256" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="var(--gfx-green,#9bd14a)" letter-spacing="1">ETAPA DE DECISIÓN</text>
<text x="518" y="298" text-anchor="middle" font-size="22" font-family="ui-monospace,monospace" fill="var(--gfx-ink,#e8eaed)" font-weight="900">LLM</text>
<text x="518" y="324" text-anchor="middle" font-size="12" font-family="ui-monospace,monospace" fill="var(--gfx-ink2,#c6cace)">sin estado · texto → texto</text>
<text x="518" y="356" text-anchor="middle" font-size="10.5" font-family="system-ui,sans-serif" fill="var(--gfx-sub,#9aa0a6)" font-style="italic">percibir → actuar, condensado</text>
<text x="518" y="373" text-anchor="middle" font-size="10.5" font-family="system-ui,sans-serif" fill="var(--gfx-sub,#9aa0a6)" font-style="italic">en un solo mapeo</text>

<!-- text out of model -->
<path d="M 618 313 L 674 313" stroke="var(--gfx-green,#9bd14a)" stroke-width="2.4" fill="none" marker-end="url(#ll-g)"/>
<text x="646" y="303" text-anchor="middle" font-size="10" font-family="ui-monospace,monospace" fill="var(--gfx-green,#9bd14a)">→ texto</text>

<!-- INTENT card (right) -->
<g filter="url(#ll-sh)"><rect x="676" y="228" width="184" height="170" rx="14" fill="var(--gfx-tint-amber,#33280f)" stroke="var(--gfx-amber,#e3b341)" stroke-width="2"/></g>
<text x="768" y="256" text-anchor="middle" font-size="14" font-family="ui-monospace,monospace" fill="var(--gfx-amber,#e3b341)" font-weight="800">señal de intención</text>
<text x="768" y="282" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="var(--gfx-amber,#e3b341)">una llamada a herramienta tipada</text>
<text x="768" y="306" text-anchor="middle" font-size="12" font-family="ui-monospace,monospace" fill="var(--gfx-amber,#e3b341)">{ "move":"east" }</text>
<text x="768" y="338" text-anchor="middle" font-size="10.5" font-family="system-ui,sans-serif" fill="var(--gfx-sub,#9aa0a6)">Todavía no es la acción.</text>
<text x="768" y="355" text-anchor="middle" font-size="10.5" font-family="system-ui,sans-serif" fill="var(--gfx-sub,#9aa0a6)">una solicitud de acción que</text>
<text x="768" y="372" text-anchor="middle" font-size="10.5" font-family="system-ui,sans-serif" fill="var(--gfx-sub,#9aa0a6)">el código la lee después</text>

<!-- ③ locally-act : INTENT down, left along bottom lane to UPDATE -->
<path d="M 768 398 L 768 456 L 552 456" stroke="var(--gfx-sub,#9aa0a6)" stroke-width="2.2" fill="none" marker-end="url(#ll-n)"/>
<rect x="660" y="434" width="148" height="22" rx="11" fill="var(--gfx-panel,#17191c)" stroke="var(--gfx-line,#3a3f45)"/>
<text x="734" y="449" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="var(--gfx-ink2,#c6cace)">3 actuar localmente</text>

<!-- ENV UPDATE card (bottom center) -->
<g filter="url(#ll-sh)"><rect x="266" y="424" width="286" height="92" rx="14" fill="var(--gfx-tint-green,#1d2a12)" stroke="var(--gfx-green,#9bd14a)" stroke-width="2"/></g>
<text x="409" y="453" text-anchor="middle" font-size="14" font-family="ui-monospace,monospace" fill="var(--gfx-green,#9bd14a)" font-weight="800">actualización local del entorno</text>
<text x="409" y="477" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="var(--gfx-sub,#9aa0a6)">doMove(grid, pos, intent.move)</text>
<text x="409" y="499" text-anchor="middle" font-size="10.5" font-family="system-ui,sans-serif" fill="var(--gfx-sub,#9aa0a6)" font-style="italic">el código valida y limita la intención antes de aplicarla</text>

<!-- ④ locally-impact : UPDATE left, up the dedicated left lane (x=90) to ENV band -->
<path d="M 266 470 L 90 470 L 90 123 L 148 123" stroke="var(--gfx-green,#9bd14a)" stroke-width="2.4" fill="none" marker-end="url(#ll-g)"/>
<g transform="rotate(-90 90 300)">
  <rect x="16" y="289" width="148" height="22" rx="11" fill="var(--gfx-panel,#17191c)" stroke="var(--gfx-line,#3a3f45)"/>
  <text x="90" y="304" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="var(--gfx-green,#9bd14a)">4 producir impacto local</text>
</g>

<!-- footer -->
</svg>
