    <text x="50" y="56" class="zen-sub">- streams por eventos</text>
    <g transform="translate(16,17)" stroke="var(--gfx-amber,#f59e0b)" stroke-width="1.2" fill="none"><rect width="22" height="18" rx="2"/><line x1="0" y1="5" x2="22" y2="5"/><circle cx="4" cy="2.5" r=".5" fill="var(--gfx-amber,#f59e0b)"/><circle cx="7" cy="2.5" r=".5" fill="var(--gfx-amber,#f59e0b)"/></g>
  </g>
  <g filter="url(#zen-shadow)" transform="translate(820,185)">
    <rect width="240" height="75" rx="6" fill="var(--gfx-card,#141414)" stroke="var(--gfx-amber,#f59e0b)" stroke-width="1.2"/>
    <text x="50" y="20" class="zen-title" fill="var(--gfx-amber2,#fbbf24)">Expertos remotos</text>
    <text x="50" y="42" class="zen-sub">- distribución de tareas posteriores</text>
    <text x="50" y="56" class="zen-sub">- ciclos de workflow independientes</text>
    <g transform="translate(18,15)" stroke="var(--gfx-amber,#f59e0b)" stroke-width="1.2" fill="none"><circle cx="6" cy="14" r="2.5" fill="var(--gfx-amber,#f59e0b)"/><circle cx="16" cy="5" r="2.5" fill="var(--gfx-amber,#f59e0b)"/><circle cx="16" cy="21" r="2.5" fill="var(--gfx-amber,#f59e0b)"/><line x1="8" y1="12" x2="14" y2="7"/><line x1="8" y1="15" x2="14" y2="19"/></g>
  </g>
  <g filter="url(#zen-shadow)" transform="translate(820,300)">
    <rect width="240" height="75" rx="6" fill="var(--gfx-card,#141414)" stroke="var(--gfx-amber,#f59e0b)" stroke-width="1.2"/>
    <text x="50" y="20" class="zen-title" fill="var(--gfx-amber2,#fbbf24)">Persona / Especialista</text>
    <text x="50" y="42" class="zen-sub">- salidas administrativas</text>
    <text x="50" y="56" class="zen-sub">- validación manual</text>
    <g transform="translate(18,17)" stroke="var(--gfx-amber,#f59e0b)" stroke-width="1.2" fill="none"><circle cx="11" cy="6" r="4"/><path d="M3 19 C3 13 19 14 19 19"/></g>
  </g>

  <g transform="translate(40,405)">
    <rect width="40" height="20" rx="3" fill="var(--gfx-e1,#1a1a1a)"/><text x="20" y="13" class="zen-label" fill="var(--gfx-dim,#555)">UCP</text>
    <rect x="45" width="40" height="20" rx="3" fill="var(--gfx-e1,#1a1a1a)"/><text x="65" y="13" class="zen-label" fill="var(--gfx-dim,#555)">AP2</text>
  </g>
  <g transform="translate(935,36)">
    <rect width="60" height="20" rx="3" fill="var(--gfx-e1,#1a1a1a)"/><text x="30" y="13" class="zen-label" fill="var(--gfx-dim,#555)">AG-UI</text>
    <rect x="65" width="60" height="20" rx="3" fill="var(--gfx-e1,#1a1a1a)"/><text x="95" y="13" class="zen-label" fill="var(--gfx-dim,#555)">A2UI</text>
  </g>
  <g transform="translate(820,405)">
    <rect width="60" height="20" rx="3" fill="var(--gfx-e1,#1a1a1a)"/><text x="30" y="13" class="zen-label" fill="var(--gfx-dim,#555)">ATAH</text>
