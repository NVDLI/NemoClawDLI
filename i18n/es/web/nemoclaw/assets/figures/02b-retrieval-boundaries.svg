<svg data-locale="es-ES" class="gfx-dark" viewBox="0 0 1100 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapa de fronteras del agente: fuentes de contexto MCP a la izquierda, destinos A2A a la derecha, skills debajo, runtime en el centro y experiencia generada arriba." preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;background:var(--gfx-bg,#0d0d0d);border:1px solid var(--gfx-border,#2a2a2a);border-radius:12px;padding:16px;max-width:1300px;margin:1.5rem auto">
<!--
Provenance: course-provided boundary map.
Course adaptation: redrawn and lightly edited for Securing Agents Module 2b so the graphic places MCP beside other system boundaries.
Abstract: This multi-axis system map is designed to isolate orchestrational boundaries within autonomous applications. By separating external endpoints along a symmetrical left-to-right axis, input context discovery is handled cleanly by the Model Context Protocol (MCP) pipeline on the left, while real-time token execution paths are routed to client devices via Agent-to-Agent (A2A) networks on the right. The vertical core establishes an explicit capability brokerage cycle: the foundational Agent Skill notion sits at the lower tier as a structural capabilities broker that packs reusable intents, tool manifests, and adjacent utilities. This repository feeds directly into the middle AI Agent Runtime execution frame, which processes active tasks and pushes state signals upward to materialize decoupled Generative UI/UX and Workflows onto user frontends.
License: Apache-2.0.
-->
  <defs>
    <filter id="zen-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="var(--gfx-shadow,#000000)" flood-opacity="0.45"/>
    </filter>
    <marker id="zen-arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="var(--gfx-green,#10b981)"/>
    </marker>
    <marker id="zen-arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="var(--gfx-amber,#f59e0b)"/>
    </marker>
    <marker id="zen-arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="var(--gfx-blue2,#38bdf8)"/>
    </marker>
    <style>
      .zen-title{font-family:Arial,sans-serif;font-size:13.5px;font-weight:800;fill:var(--gfx-ink,#ffffff)}
      .zen-sub{font-family:Arial,sans-serif;font-size:11px;font-weight:600;fill:var(--gfx-sub,#999999)}
      .zen-label{font-family:ui-monospace,monospace;font-size:10.5px;font-weight:800;text-anchor:middle}
      .zen-small{font-family:Arial,sans-serif;font-size:10.5px;fill:var(--gfx-muted,#777777)}
    </style>
  </defs>

  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M280 105 L340 105 L340 225 L400 225" stroke="var(--gfx-green,#10b981)" stroke-width="2.2" marker-end="url(#zen-arrow-green)"/>
    <path d="M280 225 L400 225" stroke="var(--gfx-green,#10b981)" stroke-width="2.2" marker-end="url(#zen-arrow-green)"/>
    <path d="M280 345 L340 345 L340 225" stroke="var(--gfx-green,#10b981)" stroke-width="2.2"/>
    <path d="M700 225 L760 225 L760 105 L820 105" stroke="var(--gfx-amber,#f59e0b)" stroke-width="2.2" marker-end="url(#zen-arrow-amber)"/>
    <path d="M700 225 L820 225" stroke="var(--gfx-amber,#f59e0b)" stroke-width="2.2" marker-end="url(#zen-arrow-amber)"/>
    <path d="M700 225 L760 225 L760 345 L820 345" stroke="var(--gfx-amber,#f59e0b)" stroke-width="2.2" marker-end="url(#zen-arrow-amber)"/>
    <line x1="550" y1="145" x2="550" y2="155" stroke="var(--gfx-blue,#3b82f6)" stroke-width="2.2" marker-end="url(#zen-arrow-blue)"/>
    <line x1="550" y1="300" x2="550" y2="310" stroke="var(--gfx-blue2,#38bdf8)" stroke-width="2.2" marker-end="url(#zen-arrow-blue)"/>
  </g>

  <g transform="translate(318,213)">
    <rect width="44" height="24" rx="4" fill="var(--gfx-green-bg,#064e3b)" stroke="var(--gfx-green,#10b981)"/>
    <text x="22" y="15" class="zen-label" fill="var(--gfx-green2,#34d399)">MCP</text>
  </g>
  <g transform="translate(738,213)">
    <rect width="44" height="24" rx="4" fill="var(--gfx-amber-bg,#451a03)" stroke="var(--gfx-amber,#f59e0b)"/>
    <text x="22" y="15" class="zen-label" fill="var(--gfx-amber2,#fbbf24)">A2A</text>
  </g>

  <g filter="url(#zen-shadow)" transform="translate(400,155)">
    <rect width="300" height="145" rx="8" fill="var(--gfx-card,#141414)" stroke="var(--gfx-nvgreen,#76b900)" stroke-width="1.5"/>
    <text x="50" y="20" class="zen-title">Runtime del agente de IA</text>
    <text x="50" y="49" class="zen-sub">- coordina cambios de estado</text>
    <text x="50" y="67" class="zen-sub">- sigue los pasos activos de tokens</text>
    <text x="50" y="85" class="zen-sub">- evalúa rutas de herramientas</text>
    <text x="50" y="103" class="zen-sub">- gestiona ciclos de escalación</text>
    <g transform="translate(16,13)" stroke="var(--gfx-nvgreen,#76b900)" stroke-width="1.2" fill="none">
      <rect width="22" height="22" rx="3" stroke-width="1.5"/>
      <circle cx="11" cy="11" r="3" fill="var(--gfx-nvgreen,#76b900)"/>
      <line x1="11" y1="0" x2="11" y2="4"/><line x1="11" y1="18" x2="11" y2="22"/>
      <line x1="0" y1="11" x2="4" y2="11"/><line x1="18" y1="11" x2="22" y2="11"/>
    </g>
  </g>

  <g filter="url(#zen-shadow)" transform="translate(400,70)">
    <rect width="300" height="75" rx="8" fill="var(--gfx-card,#141414)" stroke="var(--gfx-blue,#3b82f6)" stroke-width="1.5"/>
    <text x="50" y="20" class="zen-title" fill="var(--gfx-blue3,#7eb8ff)">Experiencia generativa y workflows</text>
    <text x="50" y="42" class="zen-sub">- transmite diseños en tiempo real</text>
    <text x="50" y="56" class="zen-sub">- monta esquemas de componentes</text>
    <g transform="translate(16,14)" stroke="var(--gfx-blue,#3b82f6)" stroke-width="1.2" fill="none">
      <rect width="22" height="18" rx="2"/><path d="M4 4 L18 4 M4 9 L12 9 M4 14 L10 14" stroke-dasharray="1 1"/><rect x="14" y="8" width="5" height="7" rx="1" stroke="var(--gfx-blue3,#7eb8ff)"/>
    </g>
  </g>

  <g filter="url(#zen-shadow)" transform="translate(400,310)">
    <rect width="300" height="75" rx="8" fill="var(--gfx-card,#141414)" stroke="var(--gfx-cyan,#0ea5e9)" stroke-width="1.5"/>
    <text x="50" y="20" class="zen-title" fill="var(--gfx-blue2,#38bdf8)">Skills del agente: capacidades</text>
    <text x="50" y="42" class="zen-sub">- contiene instrucciones modulares</text>
    <text x="50" y="56" class="zen-sub">- coordina interfaz y ejecución</text>
    <g transform="translate(16,15)" stroke="var(--gfx-cyan,#0ea5e9)" stroke-width="1.2" fill="none">
      <path d="M11 2 L2 5 L2 12 C2 17 11 22 11 22 C11 22 20 17 20 12 L20 5 Z" fill="var(--gfx-blue-bg,#14222b)"/>
      <circle cx="11" cy="11" r="2.5" fill="var(--gfx-blue2,#38bdf8)"/>
    </g>
  </g>

  <g filter="url(#zen-shadow)" transform="translate(40,70)">
    <rect width="240" height="75" rx="6" fill="var(--gfx-card,#141414)" stroke="var(--gfx-green,#10b981)" stroke-width="1.2"/>
    <text x="50" y="20" class="zen-title" fill="var(--gfx-green2,#34d399)">Herramientas y APIs</text>
    <text x="50" y="42" class="zen-sub">- utilidades de varios proveedores</text>
    <text x="50" y="56" class="zen-sub">- mapas de conexión de endpoints</text>
    <g transform="translate(16,16)" stroke="var(--gfx-green,#10b981)" stroke-width="1.2" fill="none"><polyline points="5,4 1,10 5,16"/><polyline points="13,4 17,10 13,16"/><line x1="11" y1="3" x2="7" y2="17"/></g>
  </g>
  <g filter="url(#zen-shadow)" transform="translate(40,185)">
    <rect width="240" height="75" rx="6" fill="var(--gfx-card,#141414)" stroke="var(--gfx-green,#10b981)" stroke-width="1.2"/>
    <text x="50" y="20" class="zen-title" fill="var(--gfx-green2,#34d399)">Datos y contexto</text>
    <text x="50" y="42" class="zen-sub">- índices vectoriales y de workspace</text>
    <text x="50" y="56" class="zen-sub">- repositorios de archivos</text>
    <g transform="translate(16,16)" stroke="var(--gfx-green,#10b981)" stroke-width="1.2" fill="none"><ellipse cx="11" cy="5" rx="10" ry="3"/><path d="M1 5 L1 11 A10 3 0 0 0 21 11 L21 5"/><path d="M1 11 L1 17 A10 3 0 0 0 21 17 L21 11"/></g>
  </g>
  <g filter="url(#zen-shadow)" transform="translate(40,300)">
    <rect width="240" height="75" rx="6" fill="var(--gfx-card,#141414)" stroke="var(--gfx-green,#10b981)" stroke-width="1.2"/>
    <text x="50" y="20" class="zen-title" fill="var(--gfx-green2,#34d399)">Sistemas de negocio</text>
    <text x="50" y="42" class="zen-sub">- ciclos de transacciones</text>
    <text x="50" y="56" class="zen-sub">- métodos de validación</text>
    <g transform="translate(16,16)" stroke="var(--gfx-green,#10b981)" stroke-width="1.2" fill="none"><polyline points="2,2 6,2 10,14 20,14 22,6 8,6"/><circle cx="11" cy="18" r="1.5" fill="var(--gfx-green,#10b981)"/><circle cx="19" cy="18" r="1.5" fill="var(--gfx-green,#10b981)"/></g>
  </g>

  <g filter="url(#zen-shadow)" transform="translate(820,70)">
    <rect width="240" height="75" rx="6" fill="var(--gfx-card,#141414)" stroke="var(--gfx-amber,#f59e0b)" stroke-width="1.2"/>
    <text x="50" y="20" class="zen-title" fill="var(--gfx-amber2,#fbbf24)">Aplicación / Frontend</text>
