<svg data-locale="zh-CN" class="gfx-dark" viewBox="0 0 1122 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="当推理插槽中装入语言模型时，模块 1a 中的通用智能体循环就会成为 ReAct 循环。左侧是通用循环：感知读取外部世界，虚线表示的可替换插槽负责推理，行动改变外部世界。通过桥接，将语言模型装入该插槽。右侧是由模型驱动的同一循环：模型进行推理，通过调用工具来行动，再观察工具结果，该结果随后进入下一步推理。由于模型只能处理文本，因此它以读取工具结果代替感知，并通过发出工具调用来行动。" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:8px;padding:14px;max-width:1140px;margin:1.5rem auto"><defs><marker id="g1-arc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="var(--gfx-purple,#6f42c1)"/></marker><marker id="g1-bridge" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="var(--gfx-sub,#5e5e5e)"/></marker></defs><g><path d="M 302.6 99.8 A 172 172 0 0 1 405.8 278.6" fill="none" stroke="var(--gfx-purple,#6f42c1)" stroke-width="2.6" marker-end="url(#g1-arc)"/><path d="M 338.2 395.6 A 172 172 0 0 1 131.8 395.6" fill="none" stroke="var(--gfx-purple,#6f42c1)" stroke-width="2.6" marker-end="url(#g1-arc)"/><path d="M 64.2 278.6 A 172 172 0 0 1 167.4 99.8" fill="none" stroke="var(--gfx-purple,#6f42c1)" stroke-width="2.6" marker-end="url(#g1-arc)"/><circle cx="235.00" cy="86.00" r="62" fill="var(--gfx-tint-blue,#dfeaf5)" stroke="var(--gfx-blue)" stroke-width="2.6"/><text x="235.00" y="81.00" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="var(--gfx-blue)" text-anchor="middle" font-weight="700">感知</text><text x="235.00" y="103.00" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="var(--gfx-sub,#5e5e5e)" text-anchor="middle">读取外部世界</text><circle cx="383.96" cy="344.00" r="62" fill="var(--gfx-tint-purple,#eadfff)" stroke="var(--gfx-purple)" stroke-width="3.6" stroke-dasharray="7 4"/><text x="383.96" y="339.00" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="var(--gfx-purple)" text-anchor="middle" font-weight="700">推理</text><text x="383.96" y="361.00" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="var(--gfx-sub,#5e5e5e)" text-anchor="middle">可替换插槽</text><circle cx="86.04" cy="344.00" r="62" fill="var(--gfx-tint-amber,#f7e9cf)" stroke="var(--gfx-amber)" stroke-width="2.6"/><text x="86.04" y="339.00" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="var(--gfx-amber)" text-anchor="middle" font-weight="700">行动</text><text x="86.04" y="361.00" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="var(--gfx-sub,#5e5e5e)" text-anchor="middle">改变外部世界</text><text x="235" y="251" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="var(--gfx-ink,#1a1a1a)" text-anchor="middle" font-weight="800">循环</text><text x="235" y="271" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="var(--gfx-sub,#5e5e5e)" text-anchor="middle">来自模块 1a</text></g><path d="M 462.0 258 L 660.0 258" fill="none" stroke="var(--gfx-sub,#5e5e5e)" stroke-width="3" marker-end="url(#g1-bridge)"/><text x="561" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="var(--gfx-ink2,#3b3b3b)" text-anchor="middle" font-weight="700">将 LLM 装入插槽</text><text x="561" y="282" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="var(--gfx-sub,#5e5e5e)" text-anchor="middle" font-style="italic">文本到文本</text><g transform="translate(652,0)"><path d="M 302.6 99.8 A 172 172 0 0 1 405.8 278.6" fill="none" stroke="var(--gfx-purple,#6f42c1)" stroke-width="2.6" marker-end="url(#g1-arc)"/><path d="M 338.2 395.6 A 172 172 0 0 1 131.8 395.6" fill="none" stroke="var(--gfx-purple,#6f42c1)" stroke-width="2.6" marker-end="url(#g1-arc)"/><path d="M 64.2 278.6 A 172 172 0 0 1 167.4 99.8" fill="none" stroke="var(--gfx-purple,#6f42c1)" stroke-width="2.6" marker-end="url(#g1-arc)"/><circle cx="235.00" cy="86.00" r="62" fill="var(--gfx-tint-blue,#dfeaf5)" stroke="var(--gfx-blue)" stroke-width="2.6"/><text x="235.00" y="81.00" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="var(--gfx-blue)" text-anchor="middle" font-weight="700">观察</text><text x="235.00" y="103.00" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="var(--gfx-sub,#5e5e5e)" text-anchor="middle">读取结果</text><circle cx="383.96" cy="344.00" r="62" fill="var(--gfx-tint-purple,#eadfff)" stroke="var(--gfx-purple)" stroke-width="2.6"/><text x="383.96" y="339.00" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="var(--gfx-purple)" text-anchor="middle" font-weight="700">推理</text><text x="383.96" y="361.00" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="var(--gfx-sub,#5e5e5e)" text-anchor="middle">LLM 进行推理</text><circle cx="86.04" cy="344.00" r="62" fill="var(--gfx-tint-amber,#f7e9cf)" stroke="var(--gfx-amber)" stroke-width="2.6"/><text x="86.04" y="339.00" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="var(--gfx-amber)" text-anchor="middle" font-weight="700">行动</text><text x="86.04" y="361.00" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="var(--gfx-sub,#5e5e5e)" text-anchor="middle">调用工具</text><text x="235" y="251" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="var(--gfx-ink,#1a1a1a)" text-anchor="middle" font-weight="800">ReAct</text><text x="235" y="271" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="var(--gfx-sub,#5e5e5e)" text-anchor="middle">循环直至停止</text></g></svg>
