<svg data-locale="zh-CN" class="gfx-dark" viewBox="0 74 760 305" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="“Lost in the Middle”，根据 Liu et al. 2023 年的研究重绘，并映射到智能体不断增长的 messages 数组。U 形曲线展示答案准确率与所需文本在上下文中所处位置的关系。准确率在开头和末尾较高：开头固定着系统提示词，末尾则是最新的工具结果；而中间位置的准确率降至最低。随着循环不断追加轮次，原始请求会从末端的新近位置被向左推入薄弱的中间区域，这就是上下文退化。" preserveAspectRatio="xMidYMid meet" style="width:100%;max-width:1040px;height:auto;display:block;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:8px;padding:14px;margin:1.4em auto">
      <defs><marker id="litm-arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="var(--gfx-sub,#9aa0a6)"/></marker></defs>
      <rect x="320" y="90" width="172" height="240" fill="var(--gfx-amber,#e3b341)" opacity="0.09"/>
      <line x1="100" y1="90" x2="100" y2="330" stroke="var(--gfx-sub,#5e5e5e)" stroke-width="1.5"/>
      <line x1="100" y1="330" x2="712" y2="330" stroke="var(--gfx-sub,#5e5e5e)" stroke-width="1.5"/>
      <text x="60" y="210" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="var(--gfx-sub,#9aa0a6)" transform="rotate(-90 60 210)">答案准确率</text>
      <text x="94" y="100" text-anchor="end" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="var(--gfx-sub,#5e5e5e)">较高</text>
      <text x="94" y="328" text-anchor="end" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="var(--gfx-sub,#5e5e5e)">较低</text>
      <path d="M 122 108 C 250 132, 332 306, 406 308 C 480 310, 562 132, 690 108" fill="none" stroke="var(--gfx-purple,#a78bfa)" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="122" cy="108" r="6" fill="var(--gfx-blue,#5aa8ff)"/>
      <circle cx="406" cy="308" r="6" fill="var(--gfx-amber,#e3b341)"/>
      <circle cx="690" cy="108" r="6" fill="var(--gfx-green,#9bd14a)"/>
      <line x1="582" y1="128" x2="382" y2="128" stroke="var(--gfx-sub,#9aa0a6)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#litm-arr)"/>
      <text x="482" y="116" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="var(--gfx-faint,#6b7177)">每一新轮次都会将请求向左推移</text>
      <text x="122" y="352" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="var(--gfx-sub,#9aa0a6)" font-weight="700">开头</text>
      <text x="406" y="352" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="var(--gfx-sub,#9aa0a6)" font-weight="700">中间</text>
      <text x="690" y="352" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="var(--gfx-sub,#9aa0a6)" font-weight="700">末尾</text>
      <text x="122" y="372" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="var(--gfx-blue,#0969da)">系统提示词</text>
      <text x="406" y="372" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="var(--gfx-amber,#9a6700)">原始请求</text>
      <text x="690" y="372" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="var(--gfx-green,#4a7a00)">最新的工具结果</text>
    </svg>
