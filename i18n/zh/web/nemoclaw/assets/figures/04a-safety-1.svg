  <text x="490" y="80"  text-anchor="middle" font-size="9"  font-family="ui-monospace, monospace" fill="var(--gfx-sub,#6888aa)">Landlock · seccomp · netns</text>

  <rect x="380" y="116" width="220" height="40" rx="6" fill="var(--gfx-tint-sub,#eef1f4)" stroke="var(--gfx-blue,#3b82f6)" stroke-width="1.5"/>
