<svg data-locale="zh-CN" class="gfx-dark" viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;display:block;background:var(--bg,#0d0d0d);border:1px solid var(--e3,#2a2a2a);border-radius:8px;padding:14px;max-width:1040px;margin:1.5rem auto"
     role="img" aria-label="智能体核心外围有三层同心防御环，侧边标签通过引线与各环相连。从内到外依次为提示词规则、应用防护机制和内核隔离。一条出站操作箭头从智能体向外延伸，在最外层防御环处被拦截。右侧防御环外有一个外部世界框。">
  <defs>
    <marker id="ring-q6-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="var(--gfx-red,#d74e4e)"/></marker>
  </defs>

  <circle cx="200" cy="158" r="120" fill="var(--gfx-tint-blue,#0d1828)" stroke="var(--gfx-blue,#3b82f6)" stroke-width="1.5"/>
  <circle cx="200" cy="158" r="88"  fill="var(--gfx-tint-sub,#eef1f4)" stroke="var(--gfx-blue,#3b82f6)" stroke-width="1.5"/>
  <circle cx="200" cy="158" r="56"  fill="var(--gfx-panel,#f6f8fa)" stroke="var(--gfx-blue,#3b82f6)" stroke-width="1.5"/>
  <circle cx="200" cy="158" r="28"  fill="var(--e1,#fef9ee)" stroke="var(--gfx-amber,#cc7a00)" stroke-width="2.5"/>

  <text x="200" y="155" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace" fill="var(--tx,#1a1a1a)" font-weight="800">智能体</text>
  <text x="200" y="168" text-anchor="middle" font-size="9" font-family="ui-monospace, monospace" fill="var(--tx,#1a1a1a)">进程</text>

  <line x1="290" y1="88" x2="380" y2="68"  stroke="var(--gfx-sub,#a5a5a5)" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="265" y1="108" x2="380" y2="136" stroke="var(--gfx-sub,#a5a5a5)" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="235" y1="126" x2="380" y2="204" stroke="var(--gfx-sub,#a5a5a5)" stroke-width="1" stroke-dasharray="2 2"/>

