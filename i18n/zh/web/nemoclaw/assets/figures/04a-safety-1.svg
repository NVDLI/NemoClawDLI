  <rect x="380" y="254" width="220" height="32" rx="6" fill="var(--gfx-panel,#f6f8fa)" stroke="var(--gfx-line,#d0d7de)"/>
  <text x="490" y="275" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="var(--gfx-ink,#1a1a1a)">外部世界  ·  磁盘 · 网络</text>
