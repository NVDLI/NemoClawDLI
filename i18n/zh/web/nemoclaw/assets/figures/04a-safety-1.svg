  <text x="490" y="148" text-anchor="middle" font-size="9"  font-family="ui-monospace, monospace" fill="var(--gfx-sub,#6888aa)">基于模型 · 基于规则的过滤器</text>

  <rect x="380" y="184" width="220" height="40" rx="6" fill="var(--gfx-panel,#f6f8fa)" stroke="var(--gfx-blue,#3b82f6)" stroke-width="1.5"/>
