      .zen-sub{font-family:Arial,sans-serif;font-size:11px;font-weight:600;fill:var(--gfx-sub,#999999)}
      .zen-label{font-family:ui-monospace,monospace;font-size:10.5px;font-weight:800;text-anchor:middle}
      .zen-small{font-family:Arial,sans-serif;font-size:10.5px;fill:var(--gfx-muted,#777777)}
