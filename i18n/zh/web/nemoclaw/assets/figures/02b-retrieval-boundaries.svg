<svg data-locale="zh-CN" class="gfx-dark" viewBox="0 0 1100 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="智能体边界图：左侧为 MCP 上下文来源，右侧为 A2A 交付目标，下方为智能体技能，中心为运行时，上方为生成的 UX。" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;background:var(--gfx-bg,#0d0d0d);border:1px solid var(--gfx-border,#2a2a2a);border-radius:12px;padding:16px;max-width:1300px;margin:1.5rem auto">
<!--
Provenance: course-provided boundary map.
Course adaptation: redrawn and lightly edited for Securing Agents Module 2b so the graphic places MCP beside other system boundaries.
Abstract: This multi-axis system map is designed to isolate orchestrational boundaries within autonomous applications. By separating external endpoints along a symmetrical left-to-right axis, input context discovery is handled cleanly by the Model Context Protocol (MCP) pipeline on the left, while real-time token execution paths are routed to client devices via Agent-to-Agent (A2A) networks on the right. The vertical core establishes an explicit capability brokerage cycle: the foundational Agent Skill notion sits at the lower tier as a structural capabilities broker that packs reusable intents, tool manifests, and adjacent utilities. This repository feeds directly into the middle AI Agent Runtime execution frame, which processes active tasks and pushes state signals upward to materialize decoupled Generative UI/UX and Workflows onto user frontends.
License: Apache-2.0.
-->
