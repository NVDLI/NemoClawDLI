    <filter id="zen-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="var(--gfx-shadow,#000000)" flood-opacity="0.45"/>
    </filter>
    <marker id="zen-arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
