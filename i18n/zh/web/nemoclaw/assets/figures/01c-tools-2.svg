<svg data-locale="zh-CN" class="gfx-dark" viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"
       style="max-width:100%;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:8px;display:block;margin:1.2em auto"
       role="img" aria-label="一个水平居中的窄腰拓扑。顶部四个智能体框汇聚到中间一条纤细的高亮协议带，其中列有 MCP、Responses、OTel、A2A、REST 和自定义协议。协议带再向下分散连接到底部四个工具框。">
    <defs>
      <marker id="mcp-q2-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="var(--gfx-sub,#9aa0a6)"/></marker>
    </defs>
    <text x="360" y="22" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="var(--gfx-faint,#6b7177)">M 个智能体 · 一个协议层 · N 个工具</text>

    <rect x="96"  y="48" width="120" height="36" rx="6" fill="var(--gfx-tint-blue,#15273d)" stroke="var(--gfx-blue,#5aa8ff)"/>
    <text x="156" y="71" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="var(--gfx-blue,#5aa8ff)">GPT 智能体</text>
    <rect x="232" y="48" width="120" height="36" rx="6" fill="var(--gfx-tint-blue,#15273d)" stroke="var(--gfx-blue,#5aa8ff)"/>
    <text x="292" y="71" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="var(--gfx-blue,#5aa8ff)">Claude 智能体</text>
    <rect x="368" y="48" width="120" height="36" rx="6" fill="var(--gfx-tint-blue,#15273d)" stroke="var(--gfx-blue,#5aa8ff)"/>
    <text x="428" y="71" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="var(--gfx-blue,#5aa8ff)">Gemini 智能体</text>
    <rect x="504" y="48" width="120" height="36" rx="6" fill="var(--gfx-tint-blue,#15273d)" stroke="var(--gfx-blue,#5aa8ff)"/>
    <text x="564" y="71" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="var(--gfx-blue,#5aa8ff)">开放智能体</text>

    <line x1="156" y1="86" x2="320" y2="138" stroke="var(--gfx-sub,#9aa0a6)" stroke-width="1.2" marker-end="url(#mcp-q2-arr)"/>
    <line x1="292" y1="86" x2="345" y2="138" stroke="var(--gfx-sub,#9aa0a6)" stroke-width="1.2" marker-end="url(#mcp-q2-arr)"/>
    <line x1="428" y1="86" x2="375" y2="138" stroke="var(--gfx-sub,#9aa0a6)" stroke-width="1.2" marker-end="url(#mcp-q2-arr)"/>
    <line x1="564" y1="86" x2="400" y2="138" stroke="var(--gfx-sub,#9aa0a6)" stroke-width="1.2" marker-end="url(#mcp-q2-arr)"/>

    <rect x="240" y="140" width="240" height="64" rx="10" fill="var(--gfx-tint-green,#1d2a12)" stroke="var(--gfx-green,#9bd14a)" stroke-width="2.5"/>
    <text x="360" y="160" text-anchor="middle" font-size="10" font-family="ui-monospace, monospace" fill="var(--gfx-green,#9bd14a)" font-weight="700">协议层</text>
    <text x="360" y="178" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="var(--gfx-green,#9bd14a)" font-weight="700">MCP  ·  Responses  ·  OTel  ·  A2A</text>
    <text x="360" y="192" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="var(--gfx-green,#9bd14a)" font-weight="700">自选 REST  ·  自定义 JSON-RPC</text>

    <line x1="320" y1="206" x2="96" y2="258" stroke="var(--gfx-sub,#9aa0a6)" stroke-width="1.2" marker-end="url(#mcp-q2-arr)"/>
    <line x1="345" y1="206" x2="272" y2="258" stroke="var(--gfx-sub,#9aa0a6)" stroke-width="1.2" marker-end="url(#mcp-q2-arr)"/>
    <line x1="375" y1="206" x2="448" y2="258" stroke="var(--gfx-sub,#9aa0a6)" stroke-width="1.2" marker-end="url(#mcp-q2-arr)"/>
    <line x1="400" y1="206" x2="624" y2="258" stroke="var(--gfx-sub,#9aa0a6)" stroke-width="1.2" marker-end="url(#mcp-q2-arr)"/>

    <rect x="16"  y="260" width="160" height="36" rx="6" fill="var(--gfx-tint-amber,#33280f)" stroke="var(--gfx-amber,#e3b341)"/>
    <text x="96" y="283" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="var(--gfx-amber,#e3b341)">搜索</text>
    <rect x="192" y="260" width="160" height="36" rx="6" fill="var(--gfx-tint-amber,#33280f)" stroke="var(--gfx-amber,#e3b341)"/>
    <text x="272" y="283" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="var(--gfx-amber,#e3b341)">文件操作</text>
    <rect x="368" y="260" width="160" height="36" rx="6" fill="var(--gfx-tint-amber,#33280f)" stroke="var(--gfx-amber,#e3b341)"/>
    <text x="448" y="283" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="var(--gfx-amber,#e3b341)">命令行</text>
    <rect x="544" y="260" width="160" height="36" rx="6" fill="var(--gfx-tint-amber,#33280f)" stroke="var(--gfx-amber,#e3b341)"/>
    <text x="624" y="283" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="var(--gfx-amber,#e3b341)">自定义</text>
  </svg>
