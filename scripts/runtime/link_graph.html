<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="page-role" content="tool">
  <title>link-graph · course stack</title>
  <style>
    /* Chrome palette converged onto the course tokens (the values _shared.js and the framer use), so the
     link-graph matches the SKILL pages it sits beside; the viz-only colors (--ok/--dead/...) stay.
     Light theme flips the chrome on the shared data-theme + localStorage contract. */
    :root {
      --bg: #0d0d0d;
      --panel: #161616;
      --line: #2a2a2a;
      --tf: #f2f2f2;
      --mut: #b0b0b0;
      --g: #76b900;
      --gs: #8a8a8a;
      --ok: #3fb950;
      --dead: #ff7b72;
      --iso: #d29922;
      --cross: #a371f7;
      --cyc: #58a6ff;
      --stray: #ff7b72;
      --child: #ff9bce;
      --go-ink: #000000;
    }

    :root[data-theme="light"] {
      --bg: #ffffff;
      --panel: #f6f8fa;
      --line: #e1e6eb;
      --tf: #1a1a1a;
      --mut: #57606a;
      --g: #365e00;
      --gs: #57606a;
      --ok: #006b2a;
      --dead: #a40e26;
      --iso: #704d00;
      --cross: #5f2db3;
      --cyc: #005ea8;
      --stray: #a40e26;
      --child: #8c2a67;
      --go-ink: #ffffff;
      color-scheme: light;
    }

    @media(prefers-color-scheme:light) {
      :root:not([data-theme="dark"]):not([data-theme="light"]) {
        --bg: #ffffff;
        --panel: #f6f8fa;
        --line: #e1e6eb;
        --tf: #1a1a1a;
        --mut: #57606a;
        --g: #76b900;
        --gs: #57606a;
        color-scheme: light;
      }
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      height: 100%
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--bg);
      color: var(--tf);
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace
    }

    /* Shared topbar matching the framer SKILL pages: NVIDIA DLI logo, up-link, crumb, theme toggle. */
    .sx-topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: .7rem clamp(1rem, 4vw, 2rem);
      background: var(--bg);
      border-bottom: 1px solid var(--line)
    }

    .sx-topbar .sx-logo {
      font-weight: 700;
      color: var(--g);
      letter-spacing: .04em;
      text-decoration: none
    }

    .sx-topbar .sx-up {
      color: var(--mut);
      text-decoration: none
    }

    .sx-topbar .sx-up:hover {
      color: var(--tf)
    }

    .sx-topbar .sx-crumb {
      color: var(--mut)
    }

    .sx-topbar .sx-theme {
      margin-left: auto;
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      background: transparent;
      color: var(--mut);
      border: 1px solid var(--line);
      border-radius: 7px
    }

    #wrap {
      flex: 1;
      min-height: 0;
      display: flex
    }

    #side {
      width: 368px;
      flex: 0 0 368px;
      background: var(--panel);
      border-right: 1px solid var(--line);
      overflow: auto;
      padding: 12px 13px 48px
    }

    #side h1 {
      font-size: 15px;
      margin: 0 0 2px;
      color: var(--tf)
    }

    #side .sub {
      color: var(--mut);
      font-size: 11px;
      margin-bottom: 10px;
      word-break: break-all
    }

    .stat {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
      border-bottom: 1px solid var(--line);
      font-size: 12px
    }

    .stat b {
      font-weight: 700
    }

    .pill {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700
    }

    .clean {
      background: rgba(63, 185, 80, .15);
      color: var(--ok)
    }

    .issues {
      background: rgba(248, 81, 73, .15);
      color: var(--dead)
    }

    .ctl {
      margin: 9px 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      background: var(--bg)
    }

    .ctl h4 {
      margin: 0 0 6px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--mut)
    }

    .row {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin: 3px 0
    }

    label.ck {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      cursor: pointer;
      color: var(--tf)
    }

    button,
    select,
    input {
      font: inherit;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--tf);
      border-radius: 6px;
      padding: 5px 8px
    }

    button {
      cursor: pointer
    }

    button:hover {
      border-color: var(--g);
      color: var(--tf)
    }

    button.go {
      background: var(--g);
      color: var(--go-ink);
      font-weight: 700;
      border-color: var(--g)
    }

    button.go:hover {
      filter: brightness(1.12)
    }

    select,
    input {
      width: 100%
    }

    .row select,
    .row input {
      flex: 1 1 0;
      width: auto;
      min-width: 0
    }

    /* sit beside the label, not below it */
    .row>span {
      flex: 0 0 auto;
      color: var(--mut);
      font-size: 11px
    }

    #search {
      margin: 2px 0
    }

    details {
      margin-top: 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden
    }

    summary {
      cursor: pointer;
      padding: 7px 10px;
      font-weight: 700;
      background: var(--line);
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px
    }

    summary::-webkit-details-marker {
      display: none
    }

    .cnt {
      font-size: 11px;
      padding: 0 7px;
      border-radius: 9px
    }

    .lst {
      max-height: 240px;
      overflow: auto
    }

    .item {
      padding: 5px 10px;
      border-top: 1px solid var(--line);
      cursor: pointer;
      font-size: 11px;
      word-break: break-all
    }

    .item:hover {
      background: var(--line)
    }

    .item.sel {
      background: rgba(88, 166, 255, .16);
      border-left: 2px solid var(--cyc);
      padding-left: 8px
    }

    .item .arr {
      color: var(--mut)
    }

    .item .b {
      color: var(--cross)
    }

    .item .why {
      color: var(--mut);
      font-size: 10.5px;
      display: block;
      margin-top: 1px
    }

    #legend {
      margin-top: 11px;
      font-size: 10.5px;
      color: var(--mut)
    }

    #legend span {
      display: inline-flex;
      align-items: center;
      margin-right: 9px
    }

    #legend i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px
    }

    #stage {
      flex: 1;
      position: relative;
      overflow: hidden
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab
    }

    #tip {
      position: absolute;
      pointer-events: none;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 9px;
      font-size: 11.5px;
      max-width: 380px;
      display: none;
      z-index: 5;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .5)
    }

    #tip .c {
      color: var(--mut)
    }

    #detail {
      border: 1px solid var(--ok);
      border-radius: 8px;
      padding: 9px 10px;
      margin: 9px 0;
      background: var(--panel);
      display: none
    }

    #detail h4 {
      margin: 0 0 5px;
      color: var(--tf);
      font-size: 12px;
      word-break: break-all
    }

    #detail .kv {
      font-size: 11px;
      margin: 2px 0;
      color: var(--tf)
    }

    #detail .kv span {
      color: var(--mut)
    }

    #detail .verdict {
      font-weight: 700;
      margin: 4px 0;
      padding: 3px 7px;
      border-radius: 6px;
      display: inline-block
    }

    #detail ul {
      margin: 4px 0;
      padding-left: 16px
    }

    #detail li {
      font-size: 10.5px;
      word-break: break-all;
      cursor: pointer
    }

    #detail li:hover {
      color: var(--tf)
    }

    #hint {
      position: absolute;
      left: 10px;
      bottom: 8px;
      color: var(--mut);
      font-size: 11px;
      z-index: 5
    }

    #banner {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 11.5px;
      z-index: 6;
      display: none
    }
  </style>

    const COLORS = ["#58a6ff", "#3fb950", "#d29922", "#a371f7", "#f85149", "#ff9bce", "#39c5cf",

    let N, byId, E, adjOut, adjUnd, adjIn, courses, courseColor, comp, compInfo, reach, strayInfo, issueMembers, root;
    // Optional mat overlay links pages to mats with shared citations.

    function build() {
      courses = [...new Set(DATA.nodes.map(n => n.course))].sort();
      courseColor = c => COLORS[Math.max(0, courses.indexOf(c)) % COLORS.length];

        const a = (courses.indexOf(n.course) / Math.max(1, courses.length)) * Math.PI * 2, r = 240 + (i % 40) * 7;
        const cur = byId && byId.get(n.id);
        return {
          ...n, x: cur ? cur.x : Math.cos(a) * r + (i % 13 - 6) * 9, y: cur ? cur.y : Math.sin(a) * r + (i % 7 - 3) * 11,
          vx: 0, vy: 0, short: n.id.split("/").slice(-1)[0], isMat: !!n.mat
        };
      });
      byId = new Map(N.map(n => [n.id, n]));
      const resolvedEdges = DATA.edges
        .filter(e => byId.has(e.f) && byId.has(e.t))
        .map(e => ({ s: byId.get(e.f), d: byId.get(e.t), x: e.x, sk: e.s, isMat: !!e.shared }));
      // Shared-source mat overlays are produced by engine.js and stay out of reachability.
      EM = resolvedEdges.filter(e => e.isMat);
      E = resolvedEdges.filter(e => !e.isMat);
      adjOut = new Map(N.map(n => [n, []])); adjUnd = new Map(N.map(n => [n, []])); adjIn = new Map(N.map(n => [n, []]));
      E.forEach(e => { adjOut.get(e.s).push(e.d); adjIn.get(e.d).push(e.s); adjUnd.get(e.s).push(e.d); adjUnd.get(e.d).push(e.s); });

      comp = new Map(); compInfo = [];

        }
        compInfo.push({

        });
      }

      reach = new Set(); const skills = N.filter(n => n.skill); const st = [...skills]; skills.forEach(s => reach.add(s));
      while (st.length) { const u = st.pop(); for (const v of adjOut.get(u)) if (!reach.has(v)) { reach.add(v); st.push(v); } }
      // strays = navigable nodes not reachable from a SKILL, with a reason

      const _cang = c => courses.indexOf(c) / Math.max(1, courses.length) * Math.PI * 2;
      // Bundle nav/docs stay near the root; only services and cross-course content move outward.
      const _navDoc = n => {

    }

      if (n.isMat) return MAT_COLOR;
      if (n.xcut) return BRIDGE_COLOR;
      if (F.colorby === "reach") return !n.nav ? "#484f58" : (reach.has(n) ? "#3fb950" : "#f85149");
      if (F.colorby === "component") { const ci = comp.get(n); return COLORS[ci % COLORS.length]; }
      return courseColor(n.course);
    }
    // the grouping key behind the node colour drives same-colour clustering in the layout
    function colorKey(n) {
      if (n.isMat) return "·mats"; if (F.colorby === "component") return "c" + comp.get(n);
      if (F.colorby === "reach") return reach.has(n) ? "r1" : "r0"; return n.course;
    }
    const RING = { dead: "#f85149", iso: "#d29922", cross: "#a371f7", stray: "#ff7b72" };
    function ringOf(n) {
      if (isRealStray(n)) return "stray"; if (issueMembers.iso.has(n.id)) return "iso";
      if (issueMembers.dead.has(n.id)) return "dead"; if (issueMembers.cross.has(n.id)) return "cross"; return null;
    }

    // ── force layout ──────────────────────────────────────────────────────────
    let heat = 1, hl = null, drag = null, raf = null;
    // Run redraws only while warm or interacting.
    function kick(h) { if (h != null) heat = Math.max(heat, h); if (raf === null) raf = requestAnimationFrame(draw); }
    function tick() {
      // Bounded force layout caps distance, force, and velocity to avoid runaway nodes.
      if (heat < .02) return false;
      const K = 900, MAXF = 30, MAXV = 22, MIND2 = 100, CELL = 220;
      // Spatial-grid repulsion approximates all-pairs at near-linear cost.
      const live = n => !(n.isMat && !F.matLinks);   // hidden mat nodes take no part in the force
      const grid = new Map(), LN = [];
      for (let i = 0; i < N.length; i++) {
        const n = N[i]; if (!live(n)) continue; n._i = LN.length; LN.push(n);
        const k = Math.floor(n.x / CELL) + "," + Math.floor(n.y / CELL);
        let b = grid.get(k); if (!b) grid.set(k, b = []); b.push(n);
      }
      for (let i = 0; i < LN.length; i++) {
        const a = LN[i];
        const cx = Math.floor(a.x / CELL), cy = Math.floor(a.y / CELL);
        for (let gx = cx - 1; gx <= cx + 1; gx++) for (let gy = cy - 1; gy <= cy + 1; gy++) {
          const b = grid.get(gx + "," + gy); if (!b) continue;
          for (let t = 0; t < b.length; t++) {
            const m = b[t]; if (m._i <= i) continue;
            let dx = a.x - m.x, dy = a.y - m.y, d2 = dx * dx + dy * dy; if (d2 < MIND2) d2 = MIND2;
            const inv = 1 / Math.sqrt(d2); let f = K / d2; if (f > MAXF) f = MAXF;
            const ux = dx * inv, uy = dy * inv;
            a.vx += ux * f; a.vy += uy * f; m.vx -= ux * f; m.vy -= uy * f;
          }
        }
      }
      // Weak cross-cutting springs keep shared services from pulling clusters together.
      const isBridge = e => colorKey(e.s) !== colorKey(e.d);
      for (const e of E) {
        if (F.hideBridges && isBridge(e)) continue;
        const el = e.s.xcut || e.d.xcut, L0 = el ? 210 : 88, KS = el ? .0015 : .02;   // bridges are super-elastic
        let dx = e.d.x - e.s.x, dy = e.d.y - e.s.y, d2 = dx * dx + dy * dy; if (d2 < 1) d2 = 1;
        const d = Math.sqrt(d2), f = (d - L0) * KS, ux = dx / d, uy = dy / d;
        e.s.vx += ux * f; e.s.vy += uy * f; e.d.vx -= ux * f; e.d.vy -= uy * f;
      }
      if (F.matLinks) for (const e of EM) {
        let dx = e.d.x - e.s.x, dy = e.d.y - e.s.y, d2 = dx * dx + dy * dy; if (d2 < 1) d2 = 1;
        const d = Math.sqrt(d2), f = (d - 130) * .012, ux = dx / d, uy = dy / d;
        e.s.vx += ux * f; e.s.vy += uy * f; e.d.vx -= ux * f; e.d.vy -= uy * f;
      }
      // Radial gravity sets depth by radius and course grouping by angle.
      const STEP = 185, KR = .05, KTH = 1.7, ROUT = (maxDepth + 2) * STEP, RMAT = (maxDepth + 3.4) * STEP, nc = Math.max(1, courses.length);
      N.forEach(n => {
        if (n === drag) { n.vx = n.vy = 0; return; }
        if (!live(n)) { n.vx = n.vy = 0; return; }
        if (n === root) { n.vx += -n.x * .06; n.vy += -n.y * .06; }                              // hub holds the centre
        else {
          const r = Math.hypot(n.x, n.y) || .001, th = Math.atan2(n.y, n.x);
          // radius: mats outermost ring, bridges on the outer ring, everything else on its course ring
          const rt = n.isMat ? RMAT : n.xcut ? ROUT : (n.ring || 1) * STEP;
          const pull = (rt - r) * KR; n.vx += (n.x / r) * pull; n.vy += (n.y / r) * pull;
          // Tangential pull spreads each ring around a full loop.
          const ta = n.isMat ? (n.matAngle || th) : n.xcut ? (n.bridgeAngle || th) : courses.indexOf(n.course) / nc * Math.PI * 2;
          let d = ta - th; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
          const kth = (n.xcut || n.isMat) ? 2.6 : KTH;            // bridges and mats spread harder around the loop
          n.vx += -Math.sin(th) * d * kth; n.vy += Math.cos(th) * d * kth;
        }
        if (n.vx > MAXV) n.vx = MAXV; else if (n.vx < -MAXV) n.vx = -MAXV;
        if (n.vy > MAXV) n.vy = MAXV; else if (n.vy < -MAXV) n.vy = -MAXV;
        n.x += n.vx * heat; n.y += n.vy * heat; n.vx *= .86; n.vy *= .86;
        if (!(isFinite(n.x) && isFinite(n.y))) { n.x = 0; n.y = 0; n.vx = 0; n.vy = 0; }
      });
      heat *= .985;          // settle in ~260 frames (~4s) instead of ~390
      return true;
    }
    function draw() {
      raf = null;                                  // the scheduled frame fired; reschedule below only if needed
      const warm = tick();
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, cv.clientWidth, cv.clientHeight);
      const W = cv.clientWidth, H = cv.clientHeight, M = 120;   // viewport-cull margin
      ctx.lineWidth = 1;
      let dash = false; ctx.setLineDash([]);
      const drawEdge = (e, mat) => {
        if (!visible(e.s) || !visible(e.d)) return;
        if (F.hideBridges && colorKey(e.s) !== colorKey(e.d)) return;
        const a = toScreen(e.s), b = toScreen(e.d);
        if ((a.x < -M && b.x < -M) || (a.x > W + M && b.x > W + M) || (a.y < -M && b.y < -M) || (a.y > H + M && b.y > H + M)) return;
        const active = hl && (e.s === hl || e.d === hl), wantDash = mat || !!e.x;
        if (wantDash !== dash) { ctx.setLineDash(wantDash ? [4, 3] : []); dash = wantDash; }
        ctx.strokeStyle = mat ? (active ? MAT_COLOR : "rgba(86,212,192,.40)")
          : e.x ? (active ? "#f85149" : "rgba(248,81,73,.5)")
            : (active ? "#79c0ff" : "rgba(139,148,158,.30)");
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      };
      E.forEach(e => drawEdge(e, false));
      if (F.matLinks) EM.forEach(e => drawEdge(e, true));
      ctx.setLineDash([]);
      N.forEach(n => {
        if (!visible(n)) return;
        const s = toScreen(n); if (s.x < -M || s.x > W + M || s.y < -M || s.y > H + M) return;
        const deg = n.in + n.out, rad = Math.max(3, Math.min(10, 3 + deg * 0.5)) * (n.skill ? 1.6 : 1);
        const dim = hl && hl !== n && !adjUnd.get(hl).includes(n);
        ctx.globalAlpha = dim ? 0.12 : 1;
        const rc = ringOf(n);
        if (rc) { ctx.beginPath(); ctx.arc(s.x, s.y, rad + 3, 0, 7); ctx.strokeStyle = RING[rc]; ctx.lineWidth = 2; ctx.stroke(); }
        ctx.beginPath();
        if (n.skill) { ctx.moveTo(s.x, s.y - rad); ctx.lineTo(s.x + rad, s.y); ctx.lineTo(s.x, s.y + rad); ctx.lineTo(s.x - rad, s.y); ctx.closePath(); }
        else ctx.arc(s.x, s.y, rad, 0, 7);
        ctx.fillStyle = nodeColor(n); ctx.fill();
        if (n === hl) { ctx.lineWidth = 1.5; ctx.strokeStyle = "#fff"; ctx.stroke(); }
        if ((cam.z > 1.3 || n.skill || n === hl) && !dim) {
          ctx.globalAlpha = .85; ctx.fillStyle = LBL_COL;
          ctx.font = "10px ui-monospace"; ctx.fillText(n.short, s.x + rad + 3, s.y + 3);
        }
        ctx.globalAlpha = 1;
      });
      raf = (warm || drag || panning) ? requestAnimationFrame(draw) : null;
    }
    // ── interaction ───────────────────────────────────────────────────────────
    let panning = false, last = null, moved = false;
    function nodeAt(sx, sy) {
      let best = null, bd = 14; for (const n of N) {
        if (!visible(n)) continue;
        const s = toScreen(n), d = Math.hypot(s.x - sx, s.y - sy); if (d < bd) { bd = d; best = n; }
      } return best;
    }
    cv.addEventListener("mousedown", e => {
      const r = cv.getBoundingClientRect(), sx = e.clientX - r.left, sy = e.clientY - r.top;
      const n = nodeAt(sx, sy); if (n) { drag = n; showDetail(n); } else { panning = true; moved = false; } last = { x: e.clientX, y: e.clientY }; kick(.3);
    });
    addEventListener("mousemove", e => {
      const r = cv.getBoundingClientRect(), sx = e.clientX - r.left, sy = e.clientY - r.top;
      if (drag) { const w = toWorld(sx, sy); drag.x = w.x; drag.y = w.y; drag.vx = drag.vy = 0; kick(.2); }
      else if (panning && last) { moved = true; cam.x -= (e.clientX - last.x) / cam.z; cam.y -= (e.clientY - last.y) / cam.z; last = { x: e.clientX, y: e.clientY }; kick(); }
      else {
        const n = nodeAt(sx, sy);
        if (n) {
          tip.style.display = "block"; tip.style.left = (sx + 14) + "px"; tip.style.top = (sy + 12) + "px";
          const st = strayInfo.has(n) ? ` · <span style="color:#ff7b72">STRAY</span>` : (reach.has(n) ? ` · reachable` : "");
          tip.innerHTML = `<b>${n.short}</b><br><span class=c>${n.id}</span><br><span class=c>${n.course}</span> · in ${n.in} · out ${n.out}${n.skill ? " · SKILL" : ""}${st}`;
        }
        else tip.style.display = "none";
      }
    });
    addEventListener("mouseup", () => { const emptyClick = panning && !moved && !drag; drag = null; panning = false; last = null; if (emptyClick) deselect(); else kick(); });
    addEventListener("keydown", e => { if (e.key === "Escape") deselect(); });
    // resume the (browser-throttled) loop when the tab comes back to the foreground
    document.addEventListener("visibilitychange", () => { if (!document.hidden) kick(); });
    cv.addEventListener("wheel", e => {
      e.preventDefault(); const r = cv.getBoundingClientRect();
      const w = toWorld(e.clientX - r.left, e.clientY - r.top), f = e.deltaY < 0 ? 1.1 : 1 / 1.1; cam.z = Math.max(.12, Math.min(6, cam.z * f));
      const w2 = toWorld(e.clientX - r.left, e.clientY - r.top); cam.x += w.x - w2.x; cam.y += w.y - w2.y; kick();
    }, { passive: false });
    function focus(id) { const n = byId.get(id); if (!n) return; hl = n; cam.x = n.x; cam.y = n.y; cam.z = Math.max(cam.z, 1.5); showDetail(n); kick(); }
    // Clear node focus without having to pick another node (or refresh).
    function deselect() { hl = null; const d = document.getElementById("detail"); if (d) d.style.display = "none"; tip.style.display = "none"; markSelected(); kick(); }
    function fit() {
      let mnx = 1e9, mny = 1e9, mxx = -1e9, mxy = -1e9, any = false;
      N.forEach(n => { if (!visible(n)) return; any = true; mnx = Math.min(mnx, n.x); mny = Math.min(mny, n.y); mxx = Math.max(mxx, n.x); mxy = Math.max(mxy, n.y); });
      if (!any) return; cam.x = (mnx + mxx) / 2; cam.y = (mny + mxy) / 2;
      cam.z = Math.min(2, Math.max(.12, 0.85 * Math.min(cv.clientWidth / (mxx - mnx + 1), cv.clientHeight / (mxy - mny + 1))));
    }

    // ── node detail (the "why is this stray" panel) ───────────────────────────
    function showDetail(n) {
      hl = n; const d = document.getElementById("detail"); d.style.display = "block";
      const ci = compInfo[comp.get(n)];
      const sInfo = strayInfo.get(n);
      const verdict = !n.nav ? `<span class="verdict" style="background:#30363d;color:#8b949e">asset / non-navigable</span>`
        : sInfo ? `<span class="verdict" style="background:rgba(255,123,114,.2);color:#ff7b72">STRAY: ${sInfo.reason}</span>`
          : `<span class="verdict" style="background:rgba(63,185,80,.18);color:#3fb950">reachable from a SKILL hub</span>`;
      const ins = adjIn.get(n).map(s => `<li data-f="${s.id}">${s.id}</li>`).join("") || "<li><i>nothing</i></li>";
      const outs = adjOut.get(n).map(s => `<li data-f="${s.id}">${s.id}</li>`).join("") || "<li><i>nothing</i></li>";
      d.innerHTML = `<h4>${n.id}</h4>${verdict}
    <div class="kv"><span>course</span> ${n.course} · <span>in</span> ${n.in} · <span>out</span> ${n.out}${n.skill ? ' · SKILL hub' : ''}</div>
    <div class="kv"><span>component</span> #${ci.id} · ${ci.size} nodes · ${ci.hasSkill ? 'has SKILL' : 'NO SKILL'}</div>
    <div class="kv"><span>inbound (${adjIn.get(n).length})</span></div><ul>${ins}</ul>
    <div class="kv"><span>outbound (${adjOut.get(n).length})</span></div><ul>${outs}</ul>`;
      d.querySelectorAll("li[data-f]").forEach(li => li.onclick = () => focus(li.dataset.f));
      markSelected();
    }

    // ── sidebar render ─────────────────────────────────────────────────────────
    function renderStats() {
      const s = DATA.summary;
      document.getElementById("meta").textContent = `${DATA.base || ""} · ${courses.length} courses · ${N.length} nodes`;
      const navTotal = N.filter(n => n.nav).length, reachNav = N.filter(n => n.nav && reach.has(n)).length;
      document.getElementById("stats").innerHTML =
        `<div class=stat><span>internal links</span><b>${E.length}</b></div>` +
        `<div class=stat><span>components</span><b>${compInfo.length}</b></div>` +
        `<div class=stat><span>navigable reachable from SKILL</span><b>${reachNav}/${navTotal}</b></div>` +
        `<div class=stat><span>strays</span><b style="color:${strayInfo.size ? 'var(--stray)' : 'var(--ok)'}">${strayInfo.size}</b></div>` +
        `<div class=stat><span>dead / cross</span><b>${(DATA.issues.dead || []).length} / ${(DATA.issues.cross_course || []).length}</b></div>`;
    }
    function renderConn() {
      const big = [...compInfo].sort((a, b) => b.size - a.size).slice(0, 8);
      const all = [...strayInfo.entries()].sort((a, b) => a[0].id < b[0].id ? -1 : 1);
      const row = ([n, i]) => `<div class=item data-f="${n.id}"><span>${n.id}</span><span class=why>${i.reason}</span></div>`;
      document.getElementById("conn").innerHTML =
        `<details open><summary><span>connectivity · components</span><span class=cnt style="background:var(--line)">${compInfo.length}</span></summary>` +
        `<div class=lst>` + big.map(c => `<div class=item>#${c.id} · ${c.size} nodes · ${c.hasSkill ? '<span style="color:var(--ok)">SKILL</span>' : '<span style="color:var(--stray)">no SKILL</span>'} · ${c.courses.join(", ").slice(0, 60)}</div>`).join("") + `</div></details>` +
        `<details ${all.length ? 'open' : ''}><summary><span style="color:var(--stray)">strays · navigation gaps</span><span class=cnt style="background:color-mix(in srgb,var(--stray) 20%,transparent);color:var(--stray)">${all.length}</span></summary>` +
        `<div class=lst>` + (all.length ? all.map(row).join("") : `<div class=item><span style="color:var(--mut)">none, since every navigable page reaches a SKILL hub</span></div>`) + `</div></details>`;
    }
    function edgeRow(e) { return `<div class=item data-f="${e.from}"><span>${e.from.split('/').slice(-1)[0]}</span> <span class=arr>→</span> <span class=b>${(e.to || '').split('/').slice(-1)[0] || e.to}</span></div>`; }
    function nodeRow(id) { return `<div class=item data-f="${id}">${id.split('/').slice(-2).join('/')}</div>`; }
    function block(title, color, items, render) {
      if (!items || !items.length) return "";
      return `<details><summary><span style="color:${color}">${title}</span><span class=cnt style="background:color-mix(in srgb,${color} 13%,transparent);color:${color}">${items.length}</span></summary><div class=lst>` + items.map(render).join("") + `</div></details>`;
    }
    function renderLists() {
      const i = DATA.issues;
      document.getElementById("lists").innerHTML =
        block("dead links", "var(--dead)", i.dead, edgeRow) +
        block("cross-course", "var(--cross)", i.cross_course, edgeRow) +
        block("child→SKILL", "var(--child)", i.child_to_skill, edgeRow) +
        block("isolated", "var(--iso)", i.isolated, nodeRow);
      bindFocus();
    }
    function bindFocus() { document.querySelectorAll("[data-f]").forEach(el => el.onclick = () => focus(el.dataset.f)); markSelected(); }
    // highlight every list/detail row that points at the currently-focused node
    function markSelected() {
      document.querySelectorAll(".item.sel").forEach(e => e.classList.remove("sel"));
      if (hl) {
        const sel = '[data-f="' + hl.id.replace(/["\\]/g, "\\$&") + '"]';   // native selector, no full-DOM scan
        document.querySelectorAll(sel).forEach(e => e.classList.add("sel"));
      }
    }
    function renderCourseFilter() {
      const sel = document.getElementById("course-filter");
      sel.innerHTML = `<option value="">all courses</option>` + courses.map(c => `<option value="${c}">${c}</option>`).join("");
    }
    function renderLegend() {
      document.getElementById("legend").innerHTML =
        `<div style="margin-bottom:4px">nodes: <span><i style="background:${BRIDGE_COLOR}"></i>bridge (links \u2265 2 courses)</span><span><i style="background:${MAT_COLOR}"></i>mat (outermost ring)</span></div>` +
        `<div style="margin-bottom:4px">issue rings: <span><i style="background:#d29922"></i>isolated</span><span><i style="background:#f85149"></i>dead-src</span><span><i style="background:#a371f7"></i>cross</span></div>` +
        `<div>\u25c6 = SKILL hub · radius = directory depth (root centre, +1 ring per step) · dashed = cross / mat edge</div>`;
    }
    function renderAll() { renderStats(); renderConn(); renderLists(); renderLegend(); }


    // ── controls ──────────────────────────────────────────────────────────────
    function banner(msg) {
      const b = document.getElementById("banner"); b.textContent = msg; b.style.display = "block";
      clearTimeout(b._t); b._t = setTimeout(() => b.style.display = "none", 2200);
    }
    document.getElementById("search").addEventListener("input", e => { F.search = e.target.value.toLowerCase().trim(); hl = null; kick(); });
    document.getElementById("course-filter").addEventListener("change", e => { F.course = e.target.value; kick(); });
    document.getElementById("colorby").addEventListener("change", e => { F.colorby = e.target.value; kick(); });
    document.getElementById("hide-strays").addEventListener("change", e => { F.hideStrays = e.target.checked; kick(); });
    document.getElementById("hide-iso").addEventListener("change", e => { F.hideIso = e.target.checked; kick(); });
    document.getElementById("hide-assets").addEventListener("change", e => { F.hideAssets = e.target.checked; kick(); });
    document.getElementById("only-issues").addEventListener("change", e => { F.onlyIssues = e.target.checked; kick(); });
    document.getElementById("hide-bridges").addEventListener("change", e => { F.hideBridges = e.target.checked; kick(.45); });
    document.getElementById("mat-links").addEventListener("change", e => { F.matLinks = e.target.checked; kick(.7); });
    // Theme toggle: shared data-theme + localStorage contract; re-read the label colour and repaint.
    (function () {
      var b = document.querySelector(".sx-theme"); if (!b) return; var root = document.documentElement;
      function cur() { return root.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); }
      function paint() { var t = cur(); b.textContent = t === "light" ? "☾" : "☀"; b.title = t === "light" ? "Switch to dark theme" : "Switch to light theme"; }
      b.addEventListener("click", function () {
        var n = cur() === "light" ? "dark" : "light"; root.setAttribute("data-theme", n);
        try { localStorage.setItem("theme", n); } catch (e) { } paint(); refreshTheme(); kick();
      });
      paint();
    })();
    document.getElementById("btn-recompute").addEventListener("click", () => { computeTopology(); renderAll(); kick(1); banner("recomputed connectivity + relayout"); });
    document.getElementById("btn-fit").addEventListener("click", () => { fit(); kick(); });
    build(); renderCourseFilter(); renderAll(); resize(); fit(); kick(1);
  </script>
</body>
