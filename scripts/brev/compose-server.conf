# Server wrapper for the Compose course service. It replaces the image's default site,
# listens unprivileged on 8080, and serves nothing outside the shared /dli/ route.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    include /etc/nginx/nemoclaw-dli/dli-location.conf;

    # A Secure Link opens the bare origin; send it to the course entry.
    location = / {
        absolute_redirect off;
        return 302 /dli/;
    }

    location / {
        return 404;
    }
}
