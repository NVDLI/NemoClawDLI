# The course port: a second nginx server for a Brev Secure Link named "course", so a launchable can
# list one link that opens the course. route.sh installs it with @PORT@ filled in. Every address
# answers with a page that sends the browser to /dli/ on the nemoclaw link, the same hostname with
# "nemoclaw" before its first dash, where the course runs beside the agent on one origin.
server {
    listen @PORT@;
    server_name _;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        return 200 '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opening the course</title><script>var m=/^[a-z0-9]+-(.+)/i.exec(location.hostname);if(location.protocol==="https:"&&m)location.replace("https://nemoclaw-"+m[1]+"/dli/");</script></head><body style="font:16px/1.5 system-ui,sans-serif;margin:2rem"><p>Open the <b>nemoclaw</b> link on your Brev instance page and add <b>/dli/</b> to reach the course.</p></body></html>';
    }
}
