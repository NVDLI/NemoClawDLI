#
# The /dli/ route for the NemoClawDLI course on a NemoClaw Brev launchable. route.sh includes it
# in the server that answers the launchable's Secure Link, so the course and the agent share one
# origin. The built Pages site (scripts/build/build_pages.sh output) is installed at
# /var/lib/nemoclaw-dli/site/dli.

# /dli/ is the starter page, scripts/brev/index.html installed as start.html beside the site: the
# course, the launchable's agent tools, and a command reference. A Brev origin is not on the course's
# default relay list, and integrate.api.nvidia.com answers browser preflights without CORS headers,
# so the page's course links carry iframe_proxy=1; the course persists that choice per origin.
location = /dli/ {
    root /var/lib/nemoclaw-dli/site;
    try_files /start.html =404;
    server_tokens off;
    charset utf-8;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
}

location = /dli {
    absolute_redirect off;
    return 302 /dli/;
}

# Setup progress, written by the launchable's startup script while it copies the course. A course
# installed by running route.sh directly has no such file, so the route answers that it is ready.
location = /dli/setup-status.json {
    root /var/lib/nemoclaw-dli/site;
    default_type application/json;
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    try_files /setup-status.json @nemoclaw_dli_installed;
}

# xterm.js for the starter page's terminal popups. route.sh copies it from the image's own onboarding
# UI, so the course adds no browser package; the terminals themselves are the image's /ws/terminal.
location ^~ /dli/brev-terminal/ {
    alias /var/lib/nemoclaw-dli/site/brev-terminal/;
    access_log off;
    server_tokens off;
    limit_except GET HEAD {
        deny all;
    }
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
}

location @nemoclaw_dli_installed {
    default_type application/json;
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    return 200 '{"stage":"ready"}\n';
}

location = /dli/healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

location ^~ /dli/ {
    root /var/lib/nemoclaw-dli/site;
    index index.html;
    # Relative redirects keep the HTTPS Secure Link origin behind a plain-HTTP listener.
    absolute_redirect off;
    server_tokens off;
    charset utf-8;
    charset_types text/plain text/css text/markdown application/javascript application/json image/svg+xml;

    # Static course files only.
    limit_except GET HEAD {
        deny all;
    }

    # On the launchable origin, course pages share an origin with the host terminal route.
    # Refuse framing by other sites so no third-party page can drive a course page.
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;

    # Reference packets are Markdown; older mime.types files omit the extension.
    location ~* \.md$ {
        types { }
        default_type text/markdown;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
    }
}
