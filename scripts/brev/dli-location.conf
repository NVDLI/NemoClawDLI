#
# The one /dli/ route for the NemoClawDLI course on Brev. The Compose service and the
# NemoClaw launchable host include this same file, so both serve identical bytes and headers.
# The built Pages site (scripts/build/build_pages.sh output) is mounted or installed at
# /var/lib/nemoclaw-dli/site/dli.

# /dli/ is the starter page (start.html beside the site): the course, the launchable's agent tools,
# and a command reference. A Brev origin is not on the course's default relay list, and
# integrate.api.nvidia.com answers browser preflights without CORS headers, so the page's course
# links carry iframe_proxy=1; the course persists that choice per origin.
location = /dli/ {
    root /var/lib/nemoclaw-dli/site;
    try_files /start.html =404;
    server_tokens off;
    charset utf-8;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
}

location = /dli {
    absolute_redirect off;
    return 302 /dli/;
}

location = /dli/healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

location ^~ /dli/ {
    root /var/lib/nemoclaw-dli/site;
    index index.html;
    # Relative redirects keep the HTTPS Secure Link origin behind a plain-HTTP listener.
    absolute_redirect off;
    server_tokens off;
    charset utf-8;
    charset_types text/plain text/css text/markdown application/javascript application/json image/svg+xml;

    # Static course files only.
    limit_except GET HEAD {
        deny all;
    }

    # On the launchable origin, course pages share an origin with the host terminal route.
    # Refuse framing by other sites so no third-party page can drive a course page.
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;

    # Reference packets are Markdown; older mime.types files omit the extension.
    location ~* \.md$ {
        types { }
        default_type text/markdown;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
    }
}
